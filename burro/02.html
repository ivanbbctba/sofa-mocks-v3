<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Onda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --paper: #f7f6f2;
      --surface: #fffcf8;
      --ink: #1a1b1a;
      --muted: #6d706c;
      --mute: #6d706c;
      --faint: #9a9c98;
      --line: #e3e1da;
      --accent: #4f8a78;
      --accent-soft: #dce8e3;
      --go: #0f766e;
      --warn: #b45309;
      --floor: #efe8dc;
      --ok: #0f766e;
      --miss: #b45309;
      --feito: #1a1b1a;
      --leg-1: #635bff;
      --leg-2: #059669;
      --leg-3: #ea580c;
      --leg-4: #9333ea;
      --leg-5: #e11d48;
      --leg-6: #0284c8;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #e3e1da;
      color: var(--ink);
      font: 16px/1.3 Inter, "SF Pro Text", system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body { min-height: 100dvh; }

    .phone {
      position: relative;
      width: 100%;
      max-width: 390px;
      height: 100dvh;
      max-height: 844px;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(120% 70% at 50% 0%, rgba(255, 252, 248, 0.7), transparent 58%),
        var(--floor);
    }

    @media (min-height: 900px) {
      body {
        display: grid;
        place-items: center;
      }
      .phone {
        height: 844px;
        border-radius: 28px;
        box-shadow: 0 22px 56px rgba(16, 18, 24, 0.16);
      }
    }

    .map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .map svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .aisle { fill: #e3e1da; }

    .path-rest {
      fill: none;
      stroke: var(--leg-1);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.78;
    }

    .hop {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hop-done,
    .hop-now {
      stroke-width: 12;
      stroke-dasharray: none;
    }

    .hop-now { stroke-width: 14; }

    .hop-next,
    .hop-preview {
      stroke-width: 10;
      opacity: 0.78;
    }

    .hop-miss {
      stroke-width: 10;
      opacity: 0.84;
    }

    .node-future {
      fill: #fff;
      stroke: rgba(22, 24, 29, 0.16);
      stroke-width: 2.2;
    }

    .node-done { fill: var(--ok); }
    .node-miss { fill: var(--miss); }

    .node-here { fill: var(--ok); }

    .node-halo {
      fill: none;
      stroke: var(--ok);
      stroke-width: 3.2;
      opacity: 0.4;
    }

    .veil {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(247, 246, 242, 0) 0%,
        rgba(247, 246, 242, 0) 52%,
        rgba(247, 246, 242, 0.7) 78%,
        var(--paper) 100%
      );
    }

    .phone.is-claim .veil,
    .phone.is-empty .veil,
    .phone.is-done .veil {
      background: linear-gradient(
        180deg,
        rgba(247, 246, 242, 0.1) 0%,
        rgba(247, 246, 242, 0) 38%,
        rgba(247, 246, 242, 0.58) 74%,
        var(--paper) 100%
      );
    }

    .chrome {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .count {
      position: absolute;
      top: calc(14px + var(--safe-t));
      right: 16px;
      margin: 0;
      color: var(--faint);
      font-size: 13px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }

    .panel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .panel.is-on {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .claim,
    .empty {
      padding: 0 28px calc(34px + var(--safe-b));
    }

    .done {
      padding: 0 24px calc(30px + var(--safe-b));
    }

    .run {
      padding: 0 20px calc(22px + var(--safe-b));
    }

    .go,
    .again,
    .skip,
    .feito {
      appearance: none;
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .go {
      width: 100%;
      height: 52px;
      border-radius: 999px;
      background: #4f8a78;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .go:active { transform: scale(0.985); }

    .empty-copy {
      margin: 0;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.045em;
    }

    .zen-elapsed {
      margin: 0 0 14px;
      font-size: 40px;
      font-weight: 600;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
    }

    .zen-qty {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .zen-meta {
      margin: 6px 0 0;
      color: var(--mute);
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }

    .again {
      margin-top: 20px;
      align-self: flex-start;
      padding: 0;
      background: none;
      color: #4f8a78;
      font-size: 15px;
      font-weight: 500;
    }

    .speek {
      margin: 0 0 16px;
      width: min(100%, 17rem);
    }

    .qty {
      margin: 0;
      font-size: 72px;
      font-weight: 600;
      letter-spacing: -0.07em;
      line-height: 0.86;
      font-variant-numeric: tabular-nums;
    }

    .slot {
      margin: 10px 0 0;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .depois {
      margin: 4px 0 0;
      color: var(--mute);
      font-size: 14px;
      font-weight: 500;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .skip {
      padding: 12px 0;
      background: none;
      color: var(--mute);
      font-size: 14px;
    }

    .feito {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
      box-shadow: 0 10px 24px rgba(17, 19, 24, 0.2);
    }

    .feito:active,
    .skip:active { transform: scale(0.96); }

    @keyframes walk-dash {
      to { stroke-dashoffset: var(--walk-cycle, -80); }
    }

    @media (prefers-reduced-motion: reduce) {
      .panel,
      .hop-next,
      .hop-preview,
      .hop-miss {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="phone is-claim" id="app">
    <div class="map" id="map" role="img" aria-label="Caminho da onda"></div>
    <div class="veil" aria-hidden="true"></div>
    <div class="chrome">
      <p class="count" id="count" hidden>0 de 18</p>

      <section class="panel claim is-on" id="claim">
        <button type="button" class="go" id="iniciar">Iniciar</button>
      </section>

      <section class="panel empty" id="empty" aria-live="polite">
        <p class="empty-copy">Todos pegos</p>
      </section>

      <section class="panel run" id="run" aria-live="polite">
        <div class="speek" id="speek">
          <p class="qty" id="qty">10</p>
          <p class="slot" id="slot">A-01</p>
          <p class="depois" id="depois">depois C-02</p>
        </div>
        <div class="actions">
          <button type="button" class="skip" id="skip">Não achei</button>
          <button type="button" class="feito" id="feito">Feito</button>
        </div>
      </section>

      <section class="panel done" id="done">
        <p class="zen-elapsed" id="zen-elapsed">0 s</p>
        <p class="zen-qty" id="zen-qty">0 un.</p>
        <p class="zen-meta" id="zen-mass">0 kg · 0 m³</p>
        <p class="zen-meta" id="zen-accept">Aceite em 0 s</p>
        <button type="button" class="again" id="again" hidden>Começar de novo</button>
      </section>
    </div>
  </main>
  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      const AISLE = { A: 36, B: 82, C: 128, D: 174, E: 220, F: 266, G: 312, H: 358 };
      const Y0 = 72;
      const Y1 = 618;
      const TOP = 36;
      const BOT = 656;
      const FULL_BOX = [-52, -70, 494, 984];
      const TOUR_PALETTE = ["#635bff", "#059669", "#ea580c", "#9333ea", "#e11d48", "#0284c8"];
      const RUN_COLORS = TOUR_PALETTE;
      const WALK_PX_PER_MS = 0.26;
      const WAVE_GAP_MS = 800;
      const WAVE_LOOP_PAUSE_MS = 1000;
      const FREE_AT_START = 2;

      const STOPS = [
        { code: "A-01", qty: 10, kg: 4.2, m3: 0.028 },
        { code: "C-02", qty: 8, kg: 6.4, m3: 0.036 },
        { code: "E-01", qty: 10, kg: 1.8, m3: 0.012 },
        { code: "E-10", qty: 10, kg: 8.0, m3: 0.04 },
        { code: "F-02", qty: 42, kg: 5.1, m3: 0.021 },
        { code: "H-09", qty: 3, kg: 0.4, m3: 0.003 },
        { code: "H-03", qty: 12, kg: 3.6, m3: 0.014 },
        { code: "B-09", qty: 5, kg: 0.3, m3: 0.002 },
        { code: "G-01", qty: 7, kg: 1.9, m3: 0.008 },
        { code: "G-08", qty: 4, kg: 0.2, m3: 0.002 },
        { code: "C-08", qty: 6, kg: 7.2, m3: 0.048 },
        { code: "F-10", qty: 9, kg: 4.8, m3: 0.027 },
        { code: "D-04", qty: 2, kg: 1.6, m3: 0.018 },
        { code: "D-09", qty: 15, kg: 2.4, m3: 0.01 },
        { code: "A-08", qty: 1, kg: 0.9, m3: 0.006 },
        { code: "B-02", qty: 11, kg: 2.2, m3: 0.016 },
        { code: "H-01", qty: 8, kg: 1.1, m3: 0.007 },
        { code: "G-05", qty: 3, kg: 2.7, m3: 0.009 }
      ];

      const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function slotY(n) {
        return Y0 + ((n - 1) * (Y1 - Y0)) / 9;
      }

      function parseCode(code) {
        return { aisle: code[0], n: Number(code.slice(2)) };
      }

      function cleanLoc(code) {
        return String(code || "").replace(/\$\{|\}/g, "").split(";")[0].trim();
      }

      function xy(code) {
        const parsed = parseCode(cleanLoc(code));
        return { x: AISLE[parsed.aisle], y: slotY(parsed.n), aisle: parsed.aisle, n: parsed.n };
      }

      function hop(a, b) {
        if (a.aisle === b.aisle) return [a, { x: a.x, y: b.y }];
        const mid = (Y0 + Y1) / 2;
        const sameTop = a.y <= mid && b.y <= mid;
        const sameBot = a.y >= mid && b.y >= mid;
        let end;
        if (sameTop) end = Math.min(a.y, b.y) - 36;
        else if (sameBot) end = Math.max(a.y, b.y) + 36;
        else {
          const viaTop = Math.abs(a.y - TOP) + Math.abs(b.y - TOP);
          const viaBot = Math.abs(a.y - BOT) + Math.abs(b.y - BOT);
          end = viaTop <= viaBot ? TOP : BOT;
        }
        end = Math.max(TOP, Math.min(BOT, end));
        return [a, { x: a.x, y: end }, { x: b.x, y: end }, { x: b.x, y: b.y }];
      }

      function samePoint(p, q) {
        return Math.abs(p.x - q.x) < 0.4 && Math.abs(p.y - q.y) < 0.4;
      }

      function joinHops(list) {
        const out = [];
        list.forEach((seg) => {
          seg.forEach((p, i) => {
            if (i === 0 && out.length && samePoint(out[out.length - 1], p)) return;
            out.push(p);
          });
        });
        return out;
      }

      function pts(list) {
        return list.map((p) => p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");
      }

      function el(name, attrs) {
        const node = document.createElementNS(NS, name);
        Object.keys(attrs).forEach((key) => node.setAttribute(key, String(attrs[key])));
        return node;
      }

      function ease(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function hopColor() {
        if (mode === "claim" && runIndex === 0 && freeRuns === FREE_AT_START) return TOUR_PALETTE[0];
        return RUN_COLORS[runIndex % RUN_COLORS.length];
      }

      function pathLengthPx(node) {
        let len = 0;
        try { len = node.getTotalLength() || 0; } catch (err) { return 0; }
        const ctm = node.getScreenCTM && node.getScreenCTM();
        if (ctm) return len * ((Math.hypot(ctm.a, ctm.b) + Math.hypot(ctm.c, ctm.d)) / 2);
        return len;
      }

      function walkDurationMs(node) {
        return Math.max(WAVE_GAP_MS, pathLengthPx(node) / WALK_PX_PER_MS);
      }

      function fmtSec(ms) {
        const total = Math.max(0, Math.round(ms / 1000));
        const m = Math.floor(total / 60);
        const s = total % 60;
        if (m <= 0) return s + " s";
        return m + " min " + s + " s";
      }

      function fmtNum(n, digits) {
        return n.toLocaleString("pt-BR", {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits
        });
      }

      const points = STOPS.map((stop) => xy(stop.code));
      const hops = points.slice(1).map((pt, i) => hop(points[i], pt));
      const fullPath = joinHops(hops);

      const app = document.getElementById("app");
      const map = document.getElementById("map");
      const countEl = document.getElementById("count");
      const claimEl = document.getElementById("claim");
      const emptyEl = document.getElementById("empty");
      const runEl = document.getElementById("run");
      const doneEl = document.getElementById("done");
      const againEl = document.getElementById("again");
      const qtyEl = document.getElementById("qty");
      const slotEl = document.getElementById("slot");
      const depoisEl = document.getElementById("depois");
      const feitoEl = document.getElementById("feito");
      const skipEl = document.getElementById("skip");
      const zenElapsed = document.getElementById("zen-elapsed");
      const zenQty = document.getElementById("zen-qty");
      const zenMass = document.getElementById("zen-mass");
      const zenAccept = document.getElementById("zen-accept");

      const params = new URLSearchParams(window.location.search);
      let mode = "claim";
      let here = 0;
      let freeRuns = params.get("empty") === "1" ? 0 : FREE_AT_START;
      let runIndex = 0;
      const openedAt = Date.now();
      let claimedAt = 0;
      let finishedAt = 0;
      const missed = [];
      const status = STOPS.map(function () { return "pending"; });
      let box = FULL_BOX.slice();
      let svgRoot = null;
      let camToken = 0;
      let dashToken = 0;

      function show(which) {
        mode = which;
        app.className = "phone is-" + which;
        const panels = [
          [claimEl, "claim"],
          [emptyEl, "empty"],
          [runEl, "run"],
          [doneEl, "done"]
        ];
        panels.forEach((pair) => {
          const on = pair[1] === which;
          pair[0].classList.toggle("is-on", on);
          pair[0].setAttribute("aria-hidden", on ? "false" : "true");
          pair[0].inert = !on;
        });
        countEl.hidden = which !== "run";
      }

      function openGate() {
        if (freeRuns <= 0) {
          show("empty");
          paintMap();
          setBox(FULL_BOX, 700);
          return;
        }
        show("claim");
        paintMap();
        setBox(FULL_BOX, 700);
      }

      function boxOf(list, padX, padY) {
        const xs = list.map((p) => p.x);
        const ys = list.map((p) => p.y);
        let minX = Math.min.apply(null, xs) - padX;
        let maxX = Math.max.apply(null, xs) + padX;
        let minY = Math.min.apply(null, ys) - padY;
        let maxY = Math.max.apply(null, ys) + padY;
        const aspect = 390 / 844;
        let w = Math.max(248, Math.min(308, maxX - minX));
        let h = Math.max(430, Math.min(560, maxY - minY));
        if (w / h > aspect) h = w / aspect;
        else w = h * aspect;
        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2 + 48;
        return [cx - w / 2, cy - h / 2, w, h];
      }

      function frameActiveLeg(index) {
        if (index >= STOPS.length) return FULL_BOX.slice();
        const pts = index < hops.length ? hops[index] : [points[index]];
        return boxOf(pts, 96, 140);
      }

      function setBox(next, ms) {
        const from = box.slice();
        const dur = reduce ? 0 : ms;
        if (!svgRoot || dur <= 0) {
          box = next.slice();
          if (svgRoot) svgRoot.setAttribute("viewBox", box.join(" "));
          return;
        }
        const start = performance.now();
        const token = ++camToken;
        function tick(now) {
          if (token !== camToken) return;
          const t = Math.min(1, (now - start) / dur);
          const e = ease(t);
          box = from.map((v, i) => v + (next[i] - v) * e);
          svgRoot.setAttribute("viewBox", box.map((n) => n.toFixed(2)).join(" "));
          if (t < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }

      function dashLoop(node, pattern) {
        node.style.strokeDasharray = pattern;
        node.style.strokeDashoffset = "0";
        if (reduce || mode !== "run") return;
        const period = 20;
        node.style.setProperty("--walk-cycle", String(-period));
        node.style.animation = "walk-dash " + (walkDurationMs(node) + WAVE_LOOP_PAUSE_MS) + "ms linear infinite";
      }

      function drawSolid(node) {
        let len = 1;
        try { len = node.getTotalLength() || 1; } catch (err) { len = 1; }
        node.style.animation = "none";
        if (reduce) {
          node.style.strokeDasharray = "none";
          node.style.strokeDashoffset = "0";
          return;
        }
        const token = ++dashToken;
        const dur = walkDurationMs(node);
        node.style.transition = "none";
        node.style.strokeDasharray = String(len);
        node.style.strokeDashoffset = String(len);
        node.getBoundingClientRect();
        requestAnimationFrame(function () {
          if (token !== dashToken) return;
          node.style.transition = "stroke-dashoffset " + dur + "ms linear";
          node.style.strokeDashoffset = "0";
          window.setTimeout(function () {
            if (token !== dashToken) return;
            node.style.transition = "none";
            node.style.strokeDasharray = "none";
            node.style.strokeDashoffset = "0";
          }, dur + 40);
        });
      }

      function paintMap() {
        map.replaceChildren();
        const svg = el("svg", {
          viewBox: box.map((n) => n.toFixed(2)).join(" "),
          preserveAspectRatio: "xMidYMid slice",
          "aria-hidden": "true"
        });
        svgRoot = svg;

        Object.keys(AISLE).forEach((letter) => {
          const x = AISLE[letter];
          svg.appendChild(el("rect", {
            class: "aisle",
            x: x - 11,
            y: 18,
            width: 22,
            height: 660,
            rx: 11
          }));
        });

        if (fullPath.length > 1 && mode !== "run") {
          svg.appendChild(el("polyline", { class: "path-rest", points: pts(fullPath) }));
        }

        const play = [];
        hops.forEach((seg, i) => {
          if (mode === "run" && i > here) {
            const node = el("polyline", {
              class: "hop hop-next",
              points: pts(seg),
              stroke: hopColor()
            });
            node.style.setProperty("--hop", hopColor());
            svg.appendChild(node);
            play.push({ node: node, cls: "hop-next" });
            return;
          }
          if (mode === "run" && i < here - 1) return;
          const color = hopColor();
          const missedHop = status[i] === "missed" || status[i + 1] === "missed";
          let cls = "hop hop-next";
          if (mode === "claim" || mode === "empty") cls = "hop hop-preview";
          else if (mode === "done" || i < here) cls = missedHop ? "hop hop-miss" : "hop hop-done";
          else if (i === here) cls = "hop hop-now";
          const node = el("polyline", {
            class: cls,
            points: pts(seg),
            stroke: color
          });
          node.style.setProperty("--hop", color);
          svg.appendChild(node);
          play.push({ node: node, cls: cls });
        });

        points.forEach((p, i) => {
          if (mode === "run" && (i < here - 1 || i > here + 1)) return;
          if (mode === "run" && i === here) {
            svg.appendChild(el("circle", { class: "node-halo", cx: p.x, cy: p.y, r: 17 }));
            svg.appendChild(el("circle", { class: "node-here", cx: p.x, cy: p.y, r: 8.5 }));
            return;
          }
          if (status[i] === "picked") {
            svg.appendChild(el("circle", { class: "node-done", cx: p.x, cy: p.y, r: 5.5 }));
            return;
          }
          if (status[i] === "missed") {
            svg.appendChild(el("circle", { class: "node-miss", cx: p.x, cy: p.y, r: 5.5 }));
            return;
          }
          svg.appendChild(el("circle", { class: "node-future", cx: p.x, cy: p.y, r: 4.5 }));
        });

        map.appendChild(svg);

        play.forEach((item) => {
          if (item.cls === "hop-preview") {
            item.node.style.strokeDasharray = "none";
            item.node.style.strokeDashoffset = "0";
            return;
          }
          if (item.cls === "hop-next" || item.cls === "hop-miss") {
            dashLoop(item.node, item.cls === "hop-miss" ? "4 10" : "8 12");
            return;
          }
          if (item.cls === "hop-now") {
            drawSolid(item.node);
            return;
          }
          item.node.style.strokeDasharray = "none";
          item.node.style.strokeDashoffset = "0";
        });
      }

      function paintHud() {
        countEl.textContent = here + " de " + STOPS.length;
        if (here >= STOPS.length) return;
        const stop = STOPS[here];
        const next = STOPS[here + 1];
        qtyEl.textContent = String(stop.qty);
        slotEl.textContent = cleanLoc(stop.code);
        depoisEl.textContent = next ? "depois " + cleanLoc(next.code) : "última parada";
        feitoEl.disabled = false;
      }

      function paintZen() {
        const picked = STOPS.filter(function (_, i) { return status[i] === "picked"; });
        const qty = picked.reduce(function (sum, stop) { return sum + stop.qty; }, 0);
        const kg = picked.reduce(function (sum, stop) { return sum + stop.kg; }, 0);
        const m3 = picked.reduce(function (sum, stop) { return sum + stop.m3; }, 0);
        const elapsed = (finishedAt || Date.now()) - (claimedAt || openedAt);
        const accept = Math.max(0, (claimedAt || openedAt) - openedAt);
        zenElapsed.textContent = fmtSec(elapsed);
        zenQty.textContent = qty + " un.";
        zenMass.textContent = fmtNum(kg, 1) + " kg · " + fmtNum(m3, 2) + " m³";
        zenAccept.textContent = "Aceite em " + fmtSec(accept);
        againEl.hidden = freeRuns <= 0;
      }

      function resetStops() {
        here = 0;
        finishedAt = 0;
        missed.length = 0;
        for (let i = 0; i < status.length; i += 1) status[i] = "pending";
      }

      function goRun(index, zoomMs) {
        here = Math.max(0, Math.min(index, STOPS.length));
        if (here >= STOPS.length) {
          finish();
          return;
        }
        show("run");
        paintHud();
        paintMap();
        setBox(frameActiveLeg(here), zoomMs);
      }

      function advance(kind) {
        if (mode !== "run" || here >= STOPS.length) return;
        status[here] = kind;
        if (kind === "missed") {
          missed.push({
            code: cleanLoc(STOPS[here].code),
            qty: STOPS[here].qty,
            at: Date.now()
          });
        }
        const next = here + 1;
        if (next >= STOPS.length) {
          finish();
          return;
        }
        here = next;
        paintHud();
        paintMap();
        setBox(frameActiveLeg(here), 720);
      }

      function finish() {
        here = STOPS.length;
        if (!finishedAt) finishedAt = Date.now();
        show("done");
        paintZen();
        paintMap();
        setBox(FULL_BOX, 900);
      }

      function start() {
        if (freeRuns <= 0) {
          openGate();
          return;
        }
        freeRuns -= 1;
        claimedAt = Date.now();
        resetStops();
        goRun(0, 1000);
      }

      function again() {
        if (freeRuns <= 0) {
          openGate();
          return;
        }
        runIndex = (runIndex + 1) % RUN_COLORS.length;
        resetStops();
        openGate();
      }

      document.getElementById("iniciar").addEventListener("click", start);
      againEl.addEventListener("click", again);
      feitoEl.addEventListener("click", function () {
        advance("picked");
      });
      skipEl.addEventListener("click", function () {
        advance("missed");
      });

      const at = parseInt(params.get("at") || "", 10);
      if (!isNaN(at) && at >= 0 && freeRuns > 0) {
        freeRuns -= 1;
        claimedAt = openedAt + 3200;
        for (let i = 0; i < Math.min(at, STOPS.length); i += 1) status[i] = "picked";
        if (at >= STOPS.length) {
          finishedAt = claimedAt + 12 * 60 * 1000 + 40000;
          finish();
        } else goRun(at, 0);
      } else {
        openGate();
      }
    })();
  </script>
</body>
</html>
