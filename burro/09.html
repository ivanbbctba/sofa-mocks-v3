<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Onda 14 · Mapa + Speek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,720&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f7f6f2;
      --surface: #fffcf8;
      --ink: #1a1b1a;
      --ink-2: #3c3e3c;
      --muted: #6d706c;
      --mute: #6d706c;
      --faint: #9a9c98;
      --line: #e3e1da;
      --accent: #4f8a78;
      --accent-soft: #dce8e3;
      --go: #0f766e;
      --warn: #b45309;
      --floor: #efe8dc;
      --road: #fffcf8;
      --rack: #e4d6b8;
      --rack-edge: #c9b48a;
      --ok: #0f766e;
      --feito: #1a1b1a;
      --white: #fffcf8;
      --speek: #fffcf8;
      --run: #635bff;
      --leg-1: #635bff;
      --leg-2: #059669;
      --leg-3: #ea580c;
      --leg-4: #9333ea;
      --leg-5: #e11d48;
      --leg-6: #0284c8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #e3e1da;
      color: var(--ink);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
    }

    .phone {
      position: relative;
      width: min(390px, 100vw);
      height: min(844px, 100dvh);
      overflow: hidden;
      background: var(--paper);
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(16, 28, 40, 0.28);
    }

    .map-pane {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      background: var(--paper);
    }

    .phone.is-pick .map-pane,
    .phone.is-zen .map-pane {
      flex: 1 1 50%;
    }

    .map-pane svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .floor-wash { fill: #efe8dc; }
    .yard { fill: #f7f6f2; }
    .rack {
      fill: var(--rack);
      stroke: var(--rack-edge);
      stroke-width: 0.035;
    }
    .road {
      fill: none;
      stroke: var(--road);
      stroke-width: 0.78;
      stroke-linecap: round;
    }
    .road-cross {
      fill: none;
      stroke: var(--road);
      stroke-width: 0.7;
      stroke-linecap: round;
    }
    .aisle-tag {
      fill: #6d706c;
      font-size: 0.42px;
      font-family: Inter, system-ui, sans-serif;
      font-weight: 700;
    }
    .path-case {
      fill: none;
      stroke: #fffcf8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 0.62;
      opacity: 0.95;
    }
    .path-ghost {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 0.34;
      opacity: 0.78;
    }
    .path-claimed {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 0.3;
      opacity: 0.42;
    }
    .path-done {
      fill: none;
      stroke: var(--run);
      stroke-width: 0.42;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.78;
    }
    .path-play {
      fill: none;
      stroke: var(--run);
      stroke-width: 0.58;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .path-play.is-draw {
      stroke-dasharray: var(--len);
      stroke-dashoffset: var(--len);
    }
    .path-ahead {
      fill: none;
      stroke: var(--run);
      stroke-width: 0.32;
      stroke-linecap: butt;
      stroke-linejoin: round;
      opacity: 0.55;
      stroke-dasharray: 0.34 0.26;
    }
    .node-done { fill: #9a9c98; }
    .node-future { fill: #e3e1da; }
    .node-next {
      fill: var(--white);
      stroke: var(--run);
      stroke-width: 0.09;
    }
    .node-here { fill: var(--ok); }
    .node-halo {
      fill: none;
      stroke: var(--ok);
      stroke-width: 0.07;
      opacity: 0.45;
    }
    .node-here.is-live {
      transform-box: fill-box;
      transform-origin: center;
      animation: here-pulse 2.2s ease-in-out infinite;
    }

    .map-chrome {
      position: absolute;
      inset: calc(10px + var(--safe-top)) 12px auto 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      z-index: 3;
      pointer-events: none;
    }

    .map-chrome > * { pointer-events: auto; }

    .pill {
      margin: 0;
      border: 0;
      background: rgba(255, 253, 248, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(12, 28, 40, 0.16);
      color: var(--ink-2);
      font: 600 12px/1 Inter, system-ui, sans-serif;
      padding: 8px 12px;
      cursor: pointer;
    }

    .count {
      cursor: default;
      font-variant-numeric: tabular-nums;
    }

    .speek-pane {
      position: relative;
      flex: 0 0 auto;
      background: var(--speek);
      padding: 16px 20px calc(18px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .phone.is-pick .speek-pane,
    .phone.is-zen .speek-pane {
      flex: 1 1 50%;
    }

    .phone.is-overview .speek-pane,
    .phone.is-taken .speek-pane {
      align-items: center;
      justify-content: center;
    }

    .kicker {
      margin: 0 0 6px;
      color: var(--mute);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hud-qty {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(64px, 18vw, 92px);
      font-weight: 720;
      letter-spacing: -0.06em;
      line-height: 0.84;
      font-variant-numeric: tabular-nums;
      color: var(--run);
    }

    .hud-loc {
      margin: 10px 0 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .hud-depois,
    .hud-count {
      margin: 6px 0 0;
      color: var(--mute);
      font-size: 15px;
      font-weight: 600;
    }

    .hud-count { font-variant-numeric: tabular-nums; }

    .speek-text {
      margin: 14px 0 0;
      font-family: Fraunces, Georgia, serif;
      font-size: 20px;
      font-weight: 560;
      line-height: 1.3;
      max-width: 18ch;
    }

    .empty-title {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: 40px;
      font-weight: 720;
      letter-spacing: -0.04em;
      text-align: center;
    }

    .actions {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 16px;
    }

    .phone.is-overview .actions,
    .phone.is-taken .actions,
    .phone.is-zen .actions {
      justify-content: center;
      width: 100%;
    }

    .btn-iniciar,
    .btn-again {
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font: 800 16px/1 Inter, system-ui, sans-serif;
      padding: 16px 28px;
      cursor: pointer;
      min-width: 168px;
    }

    .btn-iniciar { background: var(--accent); }

    .btn-feito {
      width: 84px;
      height: 84px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font: 700 15px/1 Inter, system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(20, 23, 28, 0.24);
      flex: 0 0 84px;
    }

    .btn-skip {
      border: 0;
      background: none;
      color: var(--ink-2);
      font: 600 14px/1 Inter, system-ui, sans-serif;
      padding: 10px 4px;
      cursor: pointer;
    }

    .btn-iniciar:active,
    .btn-again:active,
    .btn-feito:active,
    .btn-skip:active { transform: scale(0.97); }

    .zen-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .stat {
      margin: 0;
      background: #fffcf8;
      border-radius: 14px;
      padding: 10px 12px;
    }

    .stat b {
      display: block;
      font-size: 20px;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .stat span {
      color: var(--mute);
      font-size: 12px;
    }

    .hidden { display: none !important; }

    @keyframes walk-dash {
      to { stroke-dashoffset: var(--walk-cycle, -0.6); }
    }

    @keyframes here-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    @media (prefers-reduced-motion: reduce) {
      .path-play.is-draw,
      .path-ahead,
      .node-here.is-live { animation: none !important; transition: none !important; }
      .path-play.is-draw {
        stroke-dasharray: none !important;
        stroke-dashoffset: 0 !important;
      }
    }
  </style>
</head>
<body>
  <div class="phone is-overview" id="app">
    <section class="map-pane" id="map" role="img" aria-label="Mapa do galpão">
      <div class="map-chrome">
        <button type="button" class="pill" id="btn-share">Onda 14 · 1 link</button>
        <p class="pill count" id="count-pill">6 livres</p>
      </div>
    </section>

    <section class="speek-pane" id="speek-pane">
      <p class="kicker hidden" id="kicker">Speek</p>
      <p class="hud-qty hidden" id="qty">10</p>
      <p class="hud-loc hidden" id="loc">A-01</p>
      <p class="hud-depois hidden" id="depois">depois C-02</p>
      <p class="hud-count hidden" id="hud-count">0 de 4</p>
      <p class="speek-text hidden" id="speek-text">Dez toalhas 220 no A-01.</p>
      <p class="empty-title hidden" id="empty-title">Todos pegos</p>
      <div class="zen-grid hidden" id="zen-grid">
        <p class="stat"><b id="zen-time">0:00</b><span>tempo</span></p>
        <p class="stat"><b id="zen-qty">0 un.</b><span>quantidade</span></p>
        <p class="stat"><b id="zen-kg">0 kg</b><span>peso</span></p>
        <p class="stat"><b id="zen-m3">0 m³</b><span>volume</span></p>
      </div>
      <div class="actions" id="actions">
        <button type="button" class="btn-skip hidden" id="btn-skip">Não achei</button>
        <button type="button" class="btn-iniciar" id="btn-iniciar">Iniciar</button>
        <button type="button" class="btn-feito hidden" id="btn-feito">Feito</button>
        <button type="button" class="btn-again hidden" id="btn-again">Começar de novo</button>
      </div>
    </section>
  </div>

  <script>
    (function () {
      var TOUR_PALETTE = ["#635bff", "#059669", "#ea580c", "#9333ea", "#e11d48", "#0284c8"];
      var COLORS = TOUR_PALETTE;
      var WALK_PX_PER_MS = 0.26;
      var WAVE_GAP_MS = 800;
      var WAVE_LOOP_PAUSE_MS = 1000;
      var AISLE_X = { A: 0.78, B: 1.92, C: 3.06, D: 4.2, E: 5.34, F: 6.48, G: 7.62, H: 8.76 };
      var Y0 = 1.55;
      var Y1 = 15.85;
      var TOP = 0.85;
      var BOT = 16.65;
      var NS = "http://www.w3.org/2000/svg";
      var FULL_VB = [-1.4, -1.8, 12.3, 21.4];
      var WAVE_SHARE = "Onda 14 no Pisoly";

      var RUNS = [
        {
          stops: [
            { code: "A-01", qty: 10, sku: "TOALHA-220", kg: 4.8, m3: 0.09, speak: "Dez toalhas 220 no A-01." },
            { code: "C-02", qty: 8, sku: "JOGO-LENCOL", kg: 6.1, m3: 0.12, speak: "Oito jogos de lençol no C-02." },
            { code: "E-01", qty: 10, sku: "FRONHA-PAR", kg: 2.4, m3: 0.05, speak: "Dez pares de fronha no E-01." },
            { code: "E-10", qty: 6, sku: "COBERTOR-CAS", kg: 7.2, m3: 0.16, speak: "Seis cobertores casal no E-10." }
          ]
        },
        {
          stops: [
            { code: "F-02", qty: 42, sku: "KIT-HIGIENE", kg: 9.4, m3: 0.11, speak: "Quarenta e dois kits higiene no F-02." },
            { code: "H-09", qty: 3, sku: "SABONETE", kg: 0.9, m3: 0.02, speak: "Três sabonetes no H-09." },
            { code: "H-03", qty: 12, sku: "SHAMPOO-400", kg: 5.1, m3: 0.07, speak: "Doze shampoos 400 no H-03." },
            { code: "G-01", qty: 7, sku: "CREME-HID", kg: 3.3, m3: 0.04, speak: "Sete cremes hidratantes no G-01." }
          ]
        },
        {
          stops: [
            { code: "B-09", qty: 5, sku: "ESC-DENTES", kg: 0.6, m3: 0.01, speak: "Cinco escovas de dente no B-09." },
            { code: "C-08", qty: 6, sku: "PILLOW-TOP", kg: 8.8, m3: 0.22, speak: "Seis pillow tops no C-08." },
            { code: "F-10", qty: 9, sku: "TAPETE-BAN", kg: 6.4, m3: 0.14, speak: "Nove tapetes de banho no F-10." },
            { code: "D-04", qty: 2, sku: "CORTINA-180", kg: 3.9, m3: 0.1, speak: "Duas cortinas 180 no D-04." }
          ]
        },
        {
          stops: [
            { code: "D-09", qty: 15, sku: "TOALHA-MAO", kg: 3.1, m3: 0.06, speak: "Quinze toalhas de mão no D-09." },
            { code: "A-08", qty: 1, sku: "ROUPAO-M", kg: 0.8, m3: 0.03, speak: "Um roupão M no A-08." },
            { code: "B-02", qty: 11, sku: "SACO-LIXO", kg: 2.2, m3: 0.05, speak: "Onze sacos de lixo no B-02." },
            { code: "H-01", qty: 8, sku: "PAPEL-HIG", kg: 4.0, m3: 0.08, speak: "Oito papéis higiênicos no H-01." }
          ]
        },
        {
          stops: [
            { code: "G-05", qty: 3, sku: "AMACIANTE", kg: 3.6, m3: 0.04, speak: "Três amaciantes no G-05." },
            { code: "G-08", qty: 4, sku: "ALGODAO", kg: 0.5, m3: 0.02, speak: "Quatro pacotes de algodão no G-08." },
            { code: "E-05", qty: 14, sku: "LENCOL-SOLT", kg: 5.7, m3: 0.13, speak: "Quatorze lençóis solteiro no E-05." },
            { code: "C-04", qty: 9, sku: "CAPA-TRV", kg: 2.8, m3: 0.07, speak: "Nove capas de travesseiro no C-04." }
          ]
        },
        {
          stops: [
            { code: "A-05", qty: 16, sku: "TOALHA-PISO", kg: 6.8, m3: 0.15, speak: "Dezesseis toalhas de piso no A-05." },
            { code: "B-06", qty: 4, sku: "KIT-BANHO", kg: 4.5, m3: 0.09, speak: "Quatro kits banho no B-06." },
            { code: "D-02", qty: 7, sku: "EDREDOM", kg: 8.1, m3: 0.19, speak: "Sete edredons no D-02." },
            { code: "F-06", qty: 5, sku: "PORTA-TRV", kg: 1.7, m3: 0.04, speak: "Cinco porta-travesseiros no F-06." }
          ]
        }
      ];

      function slotY(n) {
        return Y0 + ((n - 1) * (Y1 - Y0)) / 9;
      }

      function parseCode(code) {
        return { aisle: code.charAt(0), n: Number(code.slice(2)) };
      }

      function xy(code) {
        var parsed = parseCode(code);
        return { x: AISLE_X[parsed.aisle], y: slotY(parsed.n), aisle: parsed.aisle, n: parsed.n };
      }

      function hop(a, b) {
        if (a.aisle === b.aisle) return [a, { x: a.x, y: b.y }];
        var mid = (Y0 + Y1) / 2;
        var sameTop = a.y <= mid && b.y <= mid;
        var sameBot = a.y >= mid && b.y >= mid;
        var end;
        if (sameTop) end = Math.min(a.y, b.y) - 0.7;
        else if (sameBot) end = Math.max(a.y, b.y) + 0.7;
        else {
          var viaTop = Math.abs(a.y - TOP) + Math.abs(b.y - TOP);
          var viaBot = Math.abs(a.y - BOT) + Math.abs(b.y - BOT);
          end = viaTop <= viaBot ? TOP : BOT;
        }
        end = Math.max(TOP, Math.min(BOT, end));
        return [a, { x: a.x, y: end }, { x: b.x, y: end }, { x: b.x, y: b.y }];
      }

      function samePoint(p, q) {
        return Math.abs(p.x - q.x) < 0.001 && Math.abs(p.y - q.y) < 0.001;
      }

      function joinHops(hops) {
        var out = [];
        hops.forEach(function (seg) {
          seg.forEach(function (p, i) {
            if (i === 0 && out.length && samePoint(out[out.length - 1], p)) return;
            out.push(p);
          });
        });
        return out;
      }

      function geometryFor(stops) {
        var points = stops.map(function (stop) { return xy(stop.code); });
        var hops = points.slice(1).map(function (pt, i) { return hop(points[i], pt); });
        var fullPath = hops.length ? joinHops(hops) : points.slice();
        var hopSpans = [];
        var cursor = 0;
        hops.forEach(function (seg) {
          var extra = cursor === 0 ? seg.length : seg.length - 1;
          var start = cursor;
          cursor += extra;
          hopSpans.push({ from: start, to: cursor });
        });
        return { points: points, hops: hops, fullPath: fullPath, hopSpans: hopSpans };
      }

      var tours = RUNS.map(function (run, i) {
        return { color: COLORS[i], stops: run.stops, geo: geometryFor(run.stops) };
      });

      function slicePath(geo, fromIdx, toIdx) {
        if (!geo.hopSpans.length || toIdx <= 0) return geo.fullPath.slice(0, 1);
        var last = geo.hopSpans.length - 1;
        var startHop = Math.max(0, Math.min(fromIdx, last));
        var endHop = Math.max(0, Math.min(toIdx - 1, last));
        return geo.fullPath.slice(geo.hopSpans[startHop].from, geo.hopSpans[endHop].to + 1);
      }

      function pts(list) {
        return list.map(function (p) { return p.x + " " + p.y; }).join(" ");
      }

      function el(name, attrs) {
        var node = document.createElementNS(NS, name);
        Object.keys(attrs).forEach(function (key) {
          node.setAttribute(key, String(attrs[key]));
        });
        return node;
      }

      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var app = document.getElementById("app");
      var map = document.getElementById("map");
      var shareBtn = document.getElementById("btn-share");
      var countPill = document.getElementById("count-pill");
      var kicker = document.getElementById("kicker");
      var qtyEl = document.getElementById("qty");
      var locEl = document.getElementById("loc");
      var depoisEl = document.getElementById("depois");
      var hudCount = document.getElementById("hud-count");
      var speekText = document.getElementById("speek-text");
      var emptyTitle = document.getElementById("empty-title");
      var zenGrid = document.getElementById("zen-grid");
      var btnIniciar = document.getElementById("btn-iniciar");
      var btnFeito = document.getElementById("btn-feito");
      var btnSkip = document.getElementById("btn-skip");
      var btnAgain = document.getElementById("btn-again");

      var params = new URLSearchParams(window.location.search);
      var mode = params.get("vazio") === "1" ? "taken" : "overview";
      var claimed = params.get("vazio") === "1" ? [0, 1, 2, 3, 4, 5] : [];
      var runIndex = -1;
      var here = 0;
      var missed = {};
      var pickStartedAt = 0;
      var viewBox = FULL_VB.slice();
      var vbTimer = 0;

      function freeIndexes() {
        return tours.map(function (_, i) { return i; }).filter(function (i) {
          return claimed.indexOf(i) === -1;
        });
      }

      function currentTour() {
        return runIndex >= 0 ? tours[runIndex] : null;
      }

      function setRun(color) {
        document.documentElement.style.setProperty("--run", color);
      }

      function hide(node, on) {
        node.classList.toggle("hidden", on);
      }

      function fmtTime(ms) {
        var total = Math.max(0, Math.round(ms / 1000));
        return Math.floor(total / 60) + ":" + String(total % 60).padStart(2, "0");
      }

      function fmtNum(n, digits) {
        return n.toFixed(digits).replace(".", ",");
      }

      function startedOnce() {
        return claimed.length > 0;
      }

      function overviewStroke(i) {
        return startedOnce() ? COLORS[i] : TOUR_PALETTE[0];
      }

      function pathLengthPx(node) {
        var len = 0;
        try { len = node.getTotalLength() || 0; } catch (err) { return 0; }
        var ctm = node.getScreenCTM && node.getScreenCTM();
        if (ctm) return len * ((Math.hypot(ctm.a, ctm.b) + Math.hypot(ctm.c, ctm.d)) / 2);
        return len;
      }

      function walkDurationMs(node) {
        return Math.max(WAVE_GAP_MS, pathLengthPx(node) / WALK_PX_PER_MS);
      }

      function playWalkDash(node, dash, gap) {
        if (!node) return;
        node.setAttribute("stroke-dasharray", dash + " " + gap);
        node.style.strokeLinecap = "butt";
        if (reduce) return;
        node.style.setProperty("--walk-cycle", String(-(dash + gap)));
        node.style.animation = "walk-dash " + (walkDurationMs(node) + WAVE_LOOP_PAUSE_MS) + "ms linear infinite";
      }

      function playWalkDraw(node) {
        if (!node) return;
        var len = 1;
        try { len = node.getTotalLength() || 1; } catch (err) { len = 1; }
        node.style.setProperty("--len", String(len));
        node.style.strokeDasharray = String(len);
        node.style.strokeDashoffset = String(len);
        if (reduce) {
          node.style.strokeDashoffset = "0";
          return;
        }
        var dur = walkDurationMs(node);
        node.getBoundingClientRect();
        requestAnimationFrame(function () {
          node.style.transition = "stroke-dashoffset " + dur + "ms linear";
          node.style.strokeDashoffset = "0";
        });
      }

      function activeLegBox() {
        var tour = currentTour();
        var geo = tour.geo;
        var a = geo.points[here];
        var b = geo.points[Math.min(here + 1, geo.points.length - 1)];
        var hop = geo.hops[Math.min(here, Math.max(0, geo.hops.length - 1))] || [a, b];
        var xs = hop.map(function (p) { return p.x; }).concat([a.x, b.x]);
        var ys = hop.map(function (p) { return p.y; }).concat([a.y, b.y]);
        var minX = Math.min.apply(null, xs) - 2.1;
        var maxX = Math.max.apply(null, xs) + 2.4;
        var minY = Math.min.apply(null, ys) - 2.0;
        var maxY = Math.max.apply(null, ys) + 4.0;
        var w = Math.min(7.5, Math.max(6.0, maxX - minX));
        var h = Math.min(12.0, Math.max(9.8, maxY - minY));
        var aspect = 390 / 844;
        if (w / h > aspect) h = w / aspect;
        else w = h * aspect;
        var cx = (minX + maxX) / 2;
        var cy = (minY + maxY) / 2 + 0.25;
        return [cx - w / 2, cy - h / 2, w, h];
      }

      function targetViewBox() {
        if (mode !== "pick") return FULL_VB.slice();
        return activeLegBox();
      }

      function applyViewBox(svg, next, animate) {
        var dest = next.slice();
        if (!animate || reduce) {
          viewBox = dest;
          svg.setAttribute("viewBox", viewBox.join(" "));
          return;
        }
        var from = viewBox.slice();
        var t0 = performance.now();
        if (vbTimer) cancelAnimationFrame(vbTimer);
        function frame(now) {
          var u = Math.min(1, (now - t0) / 720);
          var e = 1 - Math.pow(1 - u, 3);
          viewBox = from.map(function (v, i) { return v + (dest[i] - v) * e; });
          svg.setAttribute("viewBox", viewBox.join(" "));
          if (u < 1) vbTimer = requestAnimationFrame(frame);
        }
        vbTimer = requestAnimationFrame(frame);
      }

      function drawFloor(svg) {
        svg.appendChild(el("rect", { class: "floor-wash", x: -2, y: -2, width: 14, height: 22 }));
        svg.appendChild(el("rect", { class: "yard", x: 0.1, y: 0.08, width: 9.35, height: 17.35, rx: 0.28 }));
        svg.appendChild(el("line", { class: "road-cross", x1: 0.4, y1: TOP, x2: 9.15, y2: TOP }));
        svg.appendChild(el("line", { class: "road-cross", x1: 0.4, y1: BOT, x2: 9.15, y2: BOT }));
        Object.keys(AISLE_X).forEach(function (letter) {
          var x = AISLE_X[letter];
          svg.appendChild(el("line", { class: "road", x1: x, y1: 0.45, x2: x, y2: 16.9 }));
          svg.appendChild(el("rect", { class: "rack", x: x - 0.46, y: 1.2, width: 0.28, height: 15.05, rx: 0.07 }));
          svg.appendChild(el("rect", { class: "rack", x: x + 0.18, y: 1.2, width: 0.28, height: 15.05, rx: 0.07 }));
          var tag = el("text", { class: "aisle-tag", x: x, y: 0.52, "text-anchor": "middle" });
          tag.textContent = letter;
          svg.appendChild(tag);
        });
      }

      function paintMap(fromIdx, toIdx, fly) {
        var oldSvg = map.querySelector("svg");
        if (oldSvg) oldSvg.remove();
        var svg = el("svg", {
          viewBox: viewBox.join(" "),
          preserveAspectRatio: "xMidYMid slice",
          "aria-hidden": "true"
        });
        drawFloor(svg);

        if (mode === "overview" || mode === "taken" || mode === "zen") {
          tours.forEach(function (tour, i) {
            if (tour.geo.fullPath.length < 2) return;
            var taken = claimed.indexOf(i) !== -1;
            var hue = overviewStroke(i);
            svg.appendChild(el("polyline", { class: "path-case", points: pts(tour.geo.fullPath) }));
            svg.appendChild(el("polyline", {
              class: taken ? "path-claimed" : "path-ghost",
              points: pts(tour.geo.fullPath),
              stroke: hue
            }));
            tour.geo.points.forEach(function (p) {
              svg.appendChild(el("circle", {
                cx: p.x,
                cy: p.y,
                r: taken ? 0.12 : 0.14,
                fill: hue,
                stroke: "#fffcf8",
                "stroke-width": 0.05,
                opacity: taken ? "0.5" : "0.86"
              }));
            });
          });
          map.insertBefore(svg, map.firstChild);
          applyViewBox(svg, FULL_VB.slice(), fly);
          return;
        }

        var tour = currentTour();
        var geo = tour.geo;
        if (geo.fullPath.length > 1) {
          svg.appendChild(el("polyline", {
            class: "path-claimed",
            points: pts(geo.fullPath),
            stroke: tour.color,
            opacity: "0.16"
          }));
        }
        var doneSeg = slicePath(geo, 0, toIdx);
        if (doneSeg.length > 1) {
          svg.appendChild(el("polyline", { class: "path-case", points: pts(doneSeg) }));
          svg.appendChild(el("polyline", { class: "path-done", points: pts(doneSeg) }));
        }
        var aheadSeg = slicePath(geo, toIdx, geo.points.length);
        if (aheadSeg.length > 1) {
          svg.appendChild(el("polyline", { class: "path-case", points: pts(aheadSeg), "stroke-width": 0.48 }));
          svg.appendChild(el("polyline", { class: "path-ahead", points: pts(aheadSeg) }));
        }
        var playNode = null;
        if (toIdx > 0) {
          var playSeg = slicePath(geo, fromIdx, toIdx);
          if (playSeg.length > 1) {
            svg.appendChild(el("polyline", { class: "path-case", points: pts(playSeg) }));
            playNode = el("polyline", { class: "path-play", points: pts(playSeg) });
            svg.appendChild(playNode);
          }
        }
        geo.points.forEach(function (p, i) {
          if (i === toIdx) {
            svg.appendChild(el("circle", { class: "node-halo", cx: p.x, cy: p.y, r: 0.5 }));
            var hereNode = el("circle", { class: "node-here", cx: p.x, cy: p.y, r: 0.26 });
            svg.appendChild(hereNode);
            if (!reduce) hereNode.classList.add("is-live");
            return;
          }
          if (i === toIdx + 1) {
            svg.appendChild(el("circle", { class: "node-next", cx: p.x, cy: p.y, r: 0.18 }));
            return;
          }
          svg.appendChild(el("circle", {
            class: i < toIdx ? "node-done" : "node-future",
            cx: p.x,
            cy: p.y,
            r: i < toIdx ? 0.1 : 0.08
          }));
        });
        map.insertBefore(svg, map.firstChild);
        applyViewBox(svg, targetViewBox(), fly);
        if (playNode) {
          playNode.classList.add("is-draw");
          playWalkDraw(playNode);
        }
        var aheadNode = svg.querySelector(".path-ahead");
        if (aheadNode) playWalkDash(aheadNode, 0.34, 0.26);
      }

      function paintChrome() {
        var free = freeIndexes();
        app.className = "phone is-" + mode;
        hide(kicker, mode !== "pick");
        hide(qtyEl, mode !== "pick");
        hide(locEl, mode !== "pick");
        hide(depoisEl, mode !== "pick");
        hide(hudCount, mode !== "pick");
        hide(speekText, mode !== "pick");
        hide(emptyTitle, mode !== "taken");
        hide(zenGrid, mode !== "zen");
        hide(btnIniciar, mode !== "overview");
        hide(btnFeito, mode !== "pick");
        hide(btnSkip, mode !== "pick");
        hide(btnAgain, !(mode === "zen" && free.length > 0));

        if (mode === "overview") {
          setRun(startedOnce() ? (COLORS[free[0]] || COLORS[0]) : TOUR_PALETTE[0]);
          countPill.textContent = free.length + (free.length === 1 ? " livre" : " livres");
        }

        if (mode === "taken") {
          setRun("#16181d");
          countPill.textContent = "0 livres";
        }

        if (mode === "pick") {
          var tour = currentTour();
          var stop = tour.stops[here];
          var next = tour.stops[here + 1];
          setRun(tour.color);
          qtyEl.textContent = String(stop.qty);
          locEl.textContent = stop.code;
          depoisEl.textContent = next ? "depois " + next.code : "última parada";
          hudCount.textContent = here + " de " + tour.stops.length;
          speekText.textContent = stop.speak;
          countPill.textContent = here + " de " + tour.stops.length;
        }

        if (mode === "zen") {
          var done = currentTour();
          countPill.textContent = done.stops.length + " de " + done.stops.length;
        }
      }

      function finishRun() {
        var tour = currentTour();
        var qty = 0;
        var kg = 0;
        var m3 = 0;
        tour.stops.forEach(function (stop, i) {
          if (missed[i]) return;
          qty += stop.qty;
          kg += stop.kg;
          m3 += stop.m3;
        });
        document.getElementById("zen-time").textContent = fmtTime(Date.now() - pickStartedAt);
        document.getElementById("zen-qty").textContent = qty + " un.";
        document.getElementById("zen-kg").textContent = fmtNum(kg, 1) + " kg";
        document.getElementById("zen-m3").textContent = fmtNum(m3, 2) + " m³";
        mode = "zen";
        paintChrome();
        paintMap(0, 0, true);
      }

      function enterPick(index) {
        runIndex = index;
        here = 0;
        missed = {};
        mode = "pick";
        pickStartedAt = Date.now();
        paintChrome();
        paintMap(0, 0, true);
      }

      function advance() {
        var tour = currentTour();
        if (here + 1 >= tour.stops.length) {
          finishRun();
          return;
        }
        var from = here;
        here += 1;
        paintChrome();
        paintMap(from, here, true);
      }

      function shareWave() {
        var shareUrl = new URL(window.location.href);
        shareUrl.search = "";
        var text = WAVE_SHARE + " " + shareUrl.toString();
        if (navigator.share) {
          navigator.share({ title: "Onda 14", text: WAVE_SHARE, url: shareUrl.toString() }).catch(function () {
            window.location.href = "https://wa.me/?text=" + encodeURIComponent(text);
          });
          return;
        }
        window.location.href = "https://wa.me/?text=" + encodeURIComponent(text);
      }

      btnIniciar.addEventListener("click", function () {
        var free = freeIndexes();
        if (!free.length) {
          mode = "taken";
          paintChrome();
          paintMap(0, 0, false);
          return;
        }
        claimed.push(free[0]);
        enterPick(free[0]);
      });

      btnFeito.addEventListener("click", function () {
        if (mode === "pick") advance();
      });

      btnSkip.addEventListener("click", function () {
        if (mode !== "pick") return;
        missed[here] = true;
        advance();
      });

      btnAgain.addEventListener("click", function () {
        runIndex = -1;
        here = 0;
        mode = freeIndexes().length ? "overview" : "taken";
        paintChrome();
        paintMap(0, 0, true);
      });

      shareBtn.addEventListener("click", shareWave);

      paintChrome();
      paintMap(0, 0, false);
    })();
  </script>
</body>
</html>
