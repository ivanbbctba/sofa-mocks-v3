<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Onda 14</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #e8edf5;
      --ink: #14171c;
      --ink-2: #334155;
      --mute: #64748b;
      --card: #fffdf8;
      --feito: #14171c;
      --ok: #1f9d5c;
      --run: #635bff;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: #c5cedb;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 390px;
      height: 100dvh;
      max-height: 844px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--paper);
    }

    @media (min-height: 900px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app {
        height: 844px;
        border-radius: 28px;
        box-shadow: 0 22px 56px rgba(20, 23, 28, 0.2);
      }
    }

    .map {
      position: absolute;
      inset: 0;
    }

    .route-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .aisle-pill { fill: url(#aisleFade); }

    .path-run {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 9;
      stroke-dasharray: 11 13;
      opacity: 0.9;
      animation: dash-walk 1.15s linear infinite;
    }

    .path-run.is-taken {
      opacity: 0.22;
      stroke-width: 7;
      animation-duration: 2.8s;
    }

    .path-run.is-now {
      stroke-width: 15;
      opacity: 1;
      animation-duration: 0.85s;
    }

    .path-run.is-done {
      stroke-dasharray: none;
      stroke-width: 12;
      opacity: 0.78;
      animation: none;
    }

    .path-run.is-ahead {
      stroke-width: 10;
      opacity: 0.42;
    }

    @keyframes dash-walk {
      to { stroke-dashoffset: -48; }
    }

    .node-future {
      fill: var(--paper);
      stroke: #94a3b8;
      stroke-width: 2;
    }

    .node-done { fill: #94a3b8; }
    .node-miss {
      fill: var(--paper);
      stroke: #ea580c;
      stroke-width: 2.4;
    }

    .node-next {
      fill: var(--card);
      stroke: var(--run);
      stroke-width: 3;
    }

    .node-here { fill: url(#nodeGreen); }

    .here-ring {
      fill: none;
      stroke: #3dcc70;
      stroke-width: 3.2;
      animation: breathe 2.4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.28; }
    }

    .fade {
      position: absolute;
      inset: auto 0 0;
      height: 38%;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(
        180deg,
        rgba(232, 237, 245, 0) 0%,
        rgba(232, 237, 245, 0.35) 40%,
        var(--paper) 100%
      );
      transition: opacity 0.35s ease;
    }

    .app.is-pick .fade,
    .app.is-zen .fade { opacity: 1; }

    .hud {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .hud > * { pointer-events: auto; }

    .count {
      position: absolute;
      top: calc(14px + var(--safe-t));
      right: 16px;
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--mute);
      font-variant-numeric: tabular-nums;
      opacity: 0;
    }

    .app.is-pick .count { opacity: 1; }

    .speek {
      position: absolute;
      left: 16px;
      bottom: calc(28px + var(--safe-b));
      width: min(228px, calc(100% - 118px));
      margin: 0;
      padding: 14px 16px 16px;
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 12px 28px rgba(20, 23, 28, 0.12);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
    }

    .app.is-pick .speek {
      opacity: 1;
      transform: none;
    }

    .speek-qty {
      margin: 0;
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -0.07em;
      line-height: 0.84;
      font-variant-numeric: tabular-nums;
    }

    .speek-loc {
      margin: 10px 0 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .speek-depois {
      margin: 6px 0 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--mute);
    }

    .btn-go,
    .btn-feito {
      position: absolute;
      right: 18px;
      bottom: calc(28px + var(--safe-b));
      width: 84px;
      height: 84px;
      border: 0;
      border-radius: 50%;
      background: var(--feito);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(20, 23, 28, 0.24);
    }

    .btn-go {
      left: 50%;
      right: auto;
      bottom: calc(36px + var(--safe-b));
      width: 104px;
      height: 104px;
      transform: translateX(-50%);
      background: var(--run);
      font-size: 16px;
    }

    .app.is-pick .btn-go,
    .app.is-zen .btn-go,
    .app.is-empty .btn-go { display: none; }

    .btn-feito {
      display: none;
      bottom: calc(86px + var(--safe-b));
    }

    .app.is-pick .btn-feito { display: block; }

    .btn-go:active,
    .btn-feito:active { transform: translateX(-50%) scale(0.96); }
    .app.is-pick .btn-feito:active { transform: scale(0.96); }

    .btn-miss {
      display: none;
      position: absolute;
      right: 16px;
      bottom: calc(28px + var(--safe-b));
      width: 84px;
      border: 0;
      background: transparent;
      color: var(--mute);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .app.is-pick .btn-miss { display: block; }

    .zen {
      display: none;
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: calc(24px + var(--safe-b));
      padding: 18px 18px 16px;
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 16px 36px rgba(20, 23, 28, 0.12);
    }

    .app.is-zen .zen { display: block; }

    .zen-kicker {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
    }

    .zen-title {
      margin: 6px 0 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .metric {
      padding: 10px 12px;
      border-radius: 14px;
      background: #f1f4f8;
    }

    .metric b {
      display: block;
      font-size: 20px;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .metric span {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--mute);
    }

    .btn-again {
      display: none;
      width: 100%;
      margin-top: 14px;
      height: 48px;
      border: 0;
      border-radius: 999px;
      background: var(--feito);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .app.is-zen.has-free .btn-again { display: block; }

    .empty {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: 42%;
      margin: 0;
      text-align: center;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.04em;
      color: var(--ink-2);
    }

    .app.is-empty .empty { display: block; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    @media (prefers-reduced-motion: reduce) {
      .path-run,
      .here-ring { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="app is-open" id="app">
    <div class="map" aria-hidden="true">
      <svg id="route-svg" class="route-svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="nodeGreen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6ad88a" />
            <stop offset="100%" stop-color="#1f9d5c" />
          </linearGradient>
          <linearGradient id="aisleFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b0b8c8" stop-opacity="0" />
            <stop offset="12%" stop-color="#b0b8c8" stop-opacity="0.55" />
            <stop offset="50%" stop-color="#b0b8c8" stop-opacity="0.72" />
            <stop offset="88%" stop-color="#b0b8c8" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#b0b8c8" stop-opacity="0" />
          </linearGradient>
        </defs>
        <g id="aisle-pills"></g>
        <g id="route-segs"></g>
        <g id="route-nodes"></g>
      </svg>
      <div class="fade"></div>
    </div>

    <div class="hud">
      <p class="count" id="count">0 de 3</p>
      <article class="speek" id="speek">
        <p class="speek-qty" id="qty">10</p>
        <p class="speek-loc" id="loc">A-01</p>
        <p class="speek-depois" id="depois">depois C-02</p>
      </article>
      <button type="button" class="btn-go" id="btn-iniciar">Iniciar</button>
      <button type="button" class="btn-feito" id="btn-feito">Feito</button>
      <button type="button" class="btn-miss" id="btn-miss">Não achei</button>
    </div>

    <section class="zen" id="zen">
      <p class="zen-kicker" id="zen-kicker">Corrida 1</p>
      <h2 class="zen-title">Corrida feita</h2>
      <div class="metrics">
        <p class="metric"><b id="m-time">0:00</b><span>tempo</span></p>
        <p class="metric"><b id="m-qty">0 un.</b><span>pegas</span></p>
        <p class="metric"><b id="m-miss">0</b><span>não achei</span></p>
        <p class="metric"><b id="m-stops">0</b><span>paradas</span></p>
      </div>
      <button type="button" class="btn-again" id="btn-again">Começar de novo</button>
    </section>

    <p class="empty" id="empty">Todos pegos</p>
    <p class="sr-only">Uma onda compartilhada. Iniciar assume a próxima corrida livre. Cartão de texto. Sem voz.</p>
  </div>

  <script>
    (function () {
      var COLORS = ["#635bff", "#059669", "#ea580c", "#9333ea", "#e11d48", "#0284c8"];
      var AISLE_X = { A: 40, B: 88, C: 136, D: 184, E: 232, F: 280, G: 328, H: 372 };
      var BACK_Y = 78;
      var FRONT_Y = 620;
      var WIDE = [0, 8, 390, 736];
      var PHASES = { open: "open", pick: "pick", zen: "zen", empty: "empty" };

      var RUNS = [
        [
          { qty: 10, loc: "A-01" },
          { qty: 8, loc: "C-02" },
          { qty: 10, loc: "E-01" }
        ],
        [
          { qty: 10, loc: "E-10" },
          { qty: 42, loc: "F-02" },
          { qty: 5, loc: "H-09" }
        ],
        [
          { qty: 7, loc: "B-03" },
          { qty: 5, loc: "B-09" },
          { qty: 9, loc: "G-01" }
        ],
        [
          { qty: 7, loc: "G-09" },
          { qty: 6, loc: "C-08" },
          { qty: 4, loc: "F-10" }
        ],
        [
          { qty: 8, loc: "D-04" },
          { qty: 3, loc: "D-10" },
          { qty: 11, loc: "A-06" }
        ],
        [
          { qty: 6, loc: "H-02" },
          { qty: 4, loc: "A-10" },
          { qty: 2, loc: "H-10" }
        ]
      ];

      function binY(n) {
        return BACK_Y + (n - 1) * ((FRONT_Y - BACK_Y) / 9);
      }

      function parseLoc(code) {
        var parts = code.split("-");
        return { aisle: parts[0], bin: parseInt(parts[1], 10) };
      }

      function xy(code) {
        var loc = parseLoc(code);
        return [AISLE_X[loc.aisle], binY(loc.bin)];
      }

      function corridorY(fromCode, toCode) {
        var a = parseLoc(fromCode);
        var b = parseLoc(toCode);
        var y1 = binY(a.bin);
        var y2 = binY(b.bin);
        var viaBack = Math.abs(y1 - BACK_Y) + Math.abs(y2 - BACK_Y);
        var viaFront = Math.abs(y1 - FRONT_Y) + Math.abs(y2 - FRONT_Y);
        return viaBack <= viaFront ? BACK_Y : FRONT_Y;
      }

      function segment(fromCode, toCode) {
        var p1 = xy(fromCode);
        var p2 = xy(toCode);
        if (fromCode.charAt(0) === toCode.charAt(0)) return [p1, p2];
        var via = corridorY(fromCode, toCode);
        var pts = [p1];
        if (Math.abs(p1[1] - via) > 1) pts.push([p1[0], via]);
        pts.push([p2[0], via]);
        if (Math.abs(p2[1] - via) > 1) pts.push(p2);
        return pts;
      }

      function toPath(points) {
        if (!points.length) return "";
        var d = "M " + points[0][0].toFixed(1) + " " + points[0][1].toFixed(1);
        var i;
        for (i = 1; i < points.length; i += 1) {
          d += " L " + points[i][0].toFixed(1) + " " + points[i][1].toFixed(1);
        }
        return d;
      }

      function runPath(stops) {
        var pts = [];
        var i;
        for (i = 0; i < stops.length - 1; i += 1) {
          var seg = segment(stops[i].loc, stops[i + 1].loc);
          if (!pts.length) pts = seg.slice();
          else pts = pts.concat(seg.slice(1));
        }
        return pts;
      }

      function frameLeg(stops, index) {
        var here = stops[index];
        var next = stops[index + 1] || here;
        var pts = index + 1 < stops.length
          ? segment(here.loc, next.loc)
          : [xy(here.loc), [xy(here.loc)[0] + 18, xy(here.loc)[1] + 28]];
        var xs = pts.map(function (p) { return p[0]; });
        var ys = pts.map(function (p) { return p[1]; });
        var minX = Math.min.apply(null, xs) - 64;
        var maxX = Math.max.apply(null, xs) + 64;
        var minY = Math.min.apply(null, ys) - 70;
        var maxY = Math.max.apply(null, ys) + 90;
        var aspect = 390 / 844;
        var w = Math.max(168, maxX - minX);
        var h = Math.max(280, maxY - minY);
        if (w / h > aspect) h = w / aspect;
        else w = h * aspect;
        var cx = (minX + maxX) / 2;
        var cy = (minY + maxY) / 2 + 10;
        return [cx - w / 2, cy - h / 2, w, h];
      }

      function boxString(box) {
        return box.map(function (n) { return n.toFixed(1); }).join(" ");
      }

      function easeOut(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function mixBox(a, b, t) {
        return a.map(function (v, i) { return v + (b[i] - v) * t; });
      }

      function fmtTime(ms) {
        var total = Math.max(0, Math.round(ms / 1000));
        var m = Math.floor(total / 60);
        var s = total % 60;
        return m + ":" + (s < 10 ? "0" : "") + s;
      }

      var app = document.getElementById("app");
      var svg = document.getElementById("route-svg");
      var aisleEl = document.getElementById("aisle-pills");
      var segsEl = document.getElementById("route-segs");
      var nodesEl = document.getElementById("route-nodes");
      var countEl = document.getElementById("count");
      var qtyEl = document.getElementById("qty");
      var locEl = document.getElementById("loc");
      var depoisEl = document.getElementById("depois");

      aisleEl.innerHTML = Object.keys(AISLE_X).map(function (key) {
        var x = AISLE_X[key];
        return '<rect class="aisle-pill" x="' + (x - 13).toFixed(1) + '" y="0" width="26" height="844" rx="13"></rect>';
      }).join("");

      var phase = PHASES.open;
      var claimed = [];
      var runIndex = -1;
      var here = 0;
      var misses = {};
      var startedAt = 0;
      var viewBox = WIDE.slice();

      function freeIndexes() {
        return RUNS.map(function (_, i) { return i; }).filter(function (i) {
          return claimed.indexOf(i) === -1;
        });
      }

      function setPhase(next) {
        phase = next;
        app.className = "app is-" + next;
        if (next === PHASES.zen && freeIndexes().length) app.classList.add("has-free");
        var color = runIndex >= 0 ? COLORS[runIndex] : COLORS[freeIndexes()[0] || 0];
        document.documentElement.style.setProperty("--run", color);
      }

      function assertPhase(value) {
        switch (value) {
          case PHASES.open:
          case PHASES.pick:
          case PHASES.zen:
          case PHASES.empty:
            return;
          default:
            throw new Error("fase desconhecida");
        }
      }

      function animateView(toBox) {
        var from = viewBox.slice();
        var t0 = performance.now();
        function tick(now) {
          var t = Math.min(1, (now - t0) / 720);
          viewBox = mixBox(from, toBox, easeOut(t));
          svg.setAttribute("viewBox", boxString(viewBox));
          if (t < 1) window.requestAnimationFrame(tick);
        }
        window.requestAnimationFrame(tick);
      }

      function paintOpenPaths() {
        var html = "";
        var i;
        for (i = 0; i < RUNS.length; i += 1) {
          var taken = claimed.indexOf(i) !== -1;
          html +=
            '<path class="path-run' + (taken ? " is-taken" : "") + '" stroke="' +
            COLORS[i] + '" d="' + toPath(runPath(RUNS[i])) + '"></path>';
        }
        segsEl.innerHTML = html;
        var nodes = "";
        for (i = 0; i < RUNS.length; i += 1) {
          RUNS[i].forEach(function (stop) {
            var p = xy(stop.loc);
            nodes +=
              '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) +
              '" r="5.5" fill="' + COLORS[i] + '" opacity="' +
              (claimed.indexOf(i) !== -1 ? "0.28" : "0.95") + '"></circle>';
          });
        }
        nodesEl.innerHTML = nodes;
      }

      function paintPickPaths() {
        var stops = RUNS[runIndex];
        var color = COLORS[runIndex];
        var html = "";
        var i;
        for (i = 0; i < stops.length - 1; i += 1) {
          var cls = "path-run";
          if (i < here) cls += " is-done";
          else if (i === here) cls += " is-now";
          else cls += " is-ahead";
          html +=
            '<path class="' + cls + '" stroke="' + color + '" d="' +
            toPath(segment(stops[i].loc, stops[i + 1].loc)) + '"></path>';
        }
        segsEl.innerHTML = html;

        var nodes = "";
        for (i = 0; i < stops.length; i += 1) {
          var p = xy(stops[i].loc);
          var x = p[0].toFixed(1);
          var y = p[1].toFixed(1);
          if (i === here) {
            nodes += '<circle class="here-ring" cx="' + x + '" cy="' + y + '" r="14"></circle>';
            nodes += '<circle class="node-here" cx="' + x + '" cy="' + y + '" r="8"></circle>';
          } else if (i === here + 1) {
            nodes += '<circle class="node-next" cx="' + x + '" cy="' + y + '" r="6.5"></circle>';
          } else if (i < here) {
            nodes += '<circle class="' + (misses[i] ? "node-miss" : "node-done") + '" cx="' + x + '" cy="' + y + '" r="5.5"></circle>';
          } else {
            nodes += '<circle class="node-future" cx="' + x + '" cy="' + y + '" r="5"></circle>';
          }
        }
        nodesEl.innerHTML = nodes;
      }

      function paintHud() {
        if (phase !== PHASES.pick) return;
        var stops = RUNS[runIndex];
        var stop = stops[here];
        var next = stops[here + 1];
        qtyEl.textContent = String(stop.qty);
        locEl.textContent = stop.loc;
        depoisEl.textContent = next ? "depois " + next.loc : "última parada";
        countEl.textContent = here + " de " + stops.length;
      }

      function paintZen() {
        var stops = RUNS[runIndex];
        var qty = 0;
        var miss = 0;
        var i;
        for (i = 0; i < stops.length; i += 1) {
          if (misses[i]) miss += 1;
          else qty += stops[i].qty;
        }
        document.getElementById("zen-kicker").textContent = "Corrida " + (runIndex + 1);
        document.getElementById("m-time").textContent = fmtTime(Date.now() - startedAt);
        document.getElementById("m-qty").textContent = qty + " un.";
        document.getElementById("m-miss").textContent = String(miss);
        document.getElementById("m-stops").textContent = String(stops.length);
      }

      function render(fly) {
        assertPhase(phase);
        if (phase === PHASES.open || phase === PHASES.empty || phase === PHASES.zen) {
          paintOpenPaths();
          svg.setAttribute("viewBox", boxString(WIDE));
          viewBox = WIDE.slice();
          return;
        }
        paintPickPaths();
        paintHud();
        var dest = frameLeg(RUNS[runIndex], here);
        if (fly) animateView(dest);
        else {
          viewBox = dest.slice();
          svg.setAttribute("viewBox", boxString(viewBox));
        }
      }

      function enterPick(index, fly) {
        runIndex = index;
        here = 0;
        misses = {};
        startedAt = Date.now();
        setPhase(PHASES.pick);
        render(fly);
      }

      function finishRun() {
        if (!freeIndexes().length) {
          setPhase(PHASES.empty);
          render(false);
          return;
        }
        setPhase(PHASES.zen);
        paintZen();
        render(false);
      }

      function advance(kind) {
        if (phase !== PHASES.pick) return;
        if (kind === "miss") misses[here] = true;
        var stops = RUNS[runIndex];
        if (here >= stops.length - 1) {
          finishRun();
          return;
        }
        here += 1;
        paintPickPaths();
        paintHud();
        animateView(frameLeg(stops, here));
      }

      function claim() {
        if (phase !== PHASES.open) return;
        var free = freeIndexes();
        if (!free.length) {
          setPhase(PHASES.empty);
          render(false);
          return;
        }
        claimed.push(free[0]);
        enterPick(free[0], true);
      }

      function again() {
        if (!freeIndexes().length) {
          setPhase(PHASES.empty);
          render(false);
          return;
        }
        runIndex = -1;
        here = 0;
        setPhase(PHASES.open);
        render(false);
      }

      document.getElementById("btn-iniciar").addEventListener("click", claim);
      document.getElementById("btn-feito").addEventListener("click", function () {
        advance("ok");
      });
      document.getElementById("btn-miss").addEventListener("click", function () {
        advance("miss");
      });
      document.getElementById("btn-again").addEventListener("click", again);

      svg.setAttribute("viewBox", boxString(WIDE));
      setPhase(PHASES.open);
      render(false);
    })();
  </script>
</body>
</html>
