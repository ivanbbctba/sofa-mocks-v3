<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f6f2" />
  <title>Onda 14</title>
  <style>
    :root {
      --paper: #f7f6f2;
      --surface: #fffcf8;
      --ink: #1a1b1a;
      --ink-2: #3c3e3c;
      --muted: #6d706c;
      --mute: #6d706c;
      --faint: #9a9c98;
      --line: #e3e1da;
      --accent: #4f8a78;
      --accent-soft: #dce8e3;
      --go: #0f766e;
      --warn: #b45309;
      --floor: #efe8dc;
      --aisle: #e3e1da;
      --feito: #1a1b1a;
      --ok: #0f766e;
      --run: #635bff;
      --leg-1: #635bff;
      --leg-2: #059669;
      --leg-3: #ea580c;
      --leg-4: #9333ea;
      --leg-5: #e11d48;
      --leg-6: #0284c8;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #e3e1da;
      color: var(--ink);
      font: 17px/1.25 "SF Pro Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
    }

    .app {
      position: relative;
      width: min(390px, 100vw);
      height: min(844px, 100dvh);
      overflow: hidden;
      background: var(--floor);
    }

    .map {
      position: absolute;
      inset: 0;
    }

    .route-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .aisle-pill { fill: var(--aisle); }

    .path-run,
    .path-done,
    .path-now,
    .path-ahead {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .path-run {
      stroke-width: 11;
      opacity: 0.78;
    }

    .path-run.is-taken {
      opacity: 0.22;
      stroke-width: 7;
    }

    .path-done {
      stroke-width: 13;
      opacity: 0.72;
    }

    .path-now {
      stroke-width: 16;
      stroke-dasharray: 1;
      stroke-dashoffset: 0;
    }

    .path-ahead {
      stroke-width: 11;
      stroke-linecap: butt;
      stroke-dasharray: 14 11;
      opacity: 0.88;
    }

    @keyframes walk-dash {
      to { stroke-dashoffset: var(--walk-cycle, -50); }
    }

    .node-future {
      fill: #e3e1da;
      opacity: 0.7;
    }

    .node-done { fill: #9a9c98; }

    .node-miss {
      fill: var(--paper);
      stroke: var(--warn);
      stroke-width: 2.4;
    }

    .node-next {
      fill: #fff;
      stroke: var(--run);
      stroke-width: 3;
    }

    .node-here { fill: var(--ok); }

    .here-ring {
      fill: none;
      stroke: var(--ok);
      stroke-width: 3;
      opacity: 0.42;
      animation: breathe 2.3s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.16; }
    }

    .hud {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .hud button { pointer-events: auto; }

    .count {
      position: absolute;
      top: calc(14px + var(--safe-t));
      right: 16px;
      margin: 0;
      color: var(--mute);
      font-size: 13px;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .sheet {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0 20px calc(18px + var(--safe-b));
      background: linear-gradient(
        180deg,
        rgba(247, 246, 242, 0) 0%,
        rgba(247, 246, 242, 0.72) 28%,
        rgba(247, 246, 242, 0.96) 62%,
        var(--paper) 100%
      );
    }

    .app.is-pick .sheet { display: block; }

    .sheet-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 14px;
      width: min(28rem, 100%);
      margin: 0 auto;
    }

    .speek-qty {
      margin: 0;
      font-size: 80px;
      font-weight: 650;
      letter-spacing: -0.07em;
      line-height: 0.84;
      font-variant-numeric: tabular-nums;
    }

    .speek-loc {
      margin: 8px 0 0;
      font-size: 21px;
      font-weight: 620;
      letter-spacing: -0.03em;
    }

    .speek-depois {
      margin: 3px 0 0;
      color: var(--mute);
      font-size: 14px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding-bottom: 4px;
    }

    .btn-go,
    .btn-feito {
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.03em;
      cursor: pointer;
    }

    .btn-go {
      position: absolute;
      left: 50%;
      bottom: calc(36px + var(--safe-b));
      width: 96px;
      height: 96px;
      transform: translateX(-50%);
      background: var(--accent);
      font-size: 16px;
      box-shadow: 0 12px 26px rgba(22, 24, 29, 0.22);
    }

    .app.is-pick .btn-go,
    .app.is-zen .btn-go,
    .app.is-empty .btn-go { display: none; }

    .btn-feito {
      display: block;
      width: 80px;
      height: 80px;
      box-shadow: 0 10px 22px rgba(22, 24, 29, 0.2);
    }

    .btn-go:active { transform: translateX(-50%) scale(0.96); }
    .btn-feito:active { transform: scale(0.96); }

    .btn-miss {
      border: 0;
      background: transparent;
      color: var(--mute);
      font: inherit;
      font-size: 13px;
      font-weight: 560;
      cursor: pointer;
      padding: 6px 4px;
    }

    .zen {
      display: none;
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: calc(22px + var(--safe-b));
      padding: 20px 18px 16px;
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 14px 32px rgba(16, 22, 32, 0.12);
    }

    .app.is-zen .zen { display: block; }

    .zen-kicker {
      margin: 0;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mute);
    }

    .zen-title {
      margin: 6px 0 0;
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -0.04em;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .metric {
      margin: 0;
      padding: 10px 12px;
      border-radius: 14px;
      background: #efe8dc;
    }

    .metric b {
      display: block;
      font-size: 20px;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .metric span {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--mute);
    }

    .btn-again {
      display: none;
      width: 100%;
      margin-top: 12px;
      height: 48px;
      border: 0;
      border-radius: 999px;
      background: var(--feito);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
    }

    .app.is-zen.has-free .btn-again { display: block; }

    .empty {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: 44%;
      margin: 0;
      text-align: center;
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    .app.is-empty .empty { display: block; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    @media (prefers-reduced-motion: reduce) {
      .path-ahead,
      .here-ring { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="app is-open" id="app">
    <div class="map" aria-hidden="true">
      <svg id="route-svg" class="route-svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
        <g id="aisle-pills"></g>
        <g id="route-segs"></g>
        <g id="route-nodes"></g>
      </svg>
    </div>

    <div class="hud">
      <p class="count" id="count"></p>
      <div class="sheet">
        <div class="sheet-row">
          <article class="speek" id="speek">
            <p class="speek-qty" id="qty">10</p>
            <p class="speek-loc" id="loc">A-01</p>
            <p class="speek-depois" id="depois">depois C-02</p>
          </article>
          <div class="actions">
            <button type="button" class="btn-feito" id="btn-feito">Feito</button>
            <button type="button" class="btn-miss" id="btn-miss">Não achei</button>
          </div>
        </div>
      </div>
      <button type="button" class="btn-go" id="btn-iniciar">Iniciar</button>
    </div>

    <section class="zen" id="zen">
      <p class="zen-kicker" id="zen-kicker">Corrida 1</p>
      <h2 class="zen-title">Corrida feita</h2>
      <div class="metrics">
        <p class="metric"><b id="m-time">0:00</b><span>tempo</span></p>
        <p class="metric"><b id="m-qty">0 un.</b><span>pegas</span></p>
        <p class="metric"><b id="m-miss">0</b><span>não achei</span></p>
        <p class="metric"><b id="m-stops">0</b><span>paradas</span></p>
      </div>
      <button type="button" class="btn-again" id="btn-again">Começar de novo</button>
    </section>

    <p class="empty" id="empty">Todos pegos</p>
    <p class="sr-only">Uma onda compartilhada. Iniciar assume a próxima corrida livre. Cartão de texto. Sem voz.</p>
  </div>

  <script>
    (function () {
      var TOUR_PALETTE = ["#635bff", "#059669", "#ea580c", "#9333ea", "#e11d48", "#0284c8"];
      var COLORS = TOUR_PALETTE;
      var WALK_PX_PER_MS = 0.26;
      var WAVE_GAP_MS = 800;
      var WAVE_LOOP_PAUSE_MS = 1000;
      var AISLE_X = { A: 40, B: 88, C: 136, D: 184, E: 232, F: 280, G: 328, H: 372 };
      var BACK_Y = 78;
      var FRONT_Y = 620;
      var WIDE = [-52, -70, 494, 984];
      var PHASES = { open: "open", pick: "pick", zen: "zen", empty: "empty" };
      var ASPECT = 390 / 844;

      var RUNS = [
        [
          { qty: 10, loc: "A-01" },
          { qty: 8, loc: "C-02" },
          { qty: 10, loc: "E-01" }
        ],
        [
          { qty: 10, loc: "E-10" },
          { qty: 42, loc: "F-02" },
          { qty: 5, loc: "H-09" }
        ],
        [
          { qty: 7, loc: "B-03" },
          { qty: 5, loc: "B-09" },
          { qty: 9, loc: "G-01" }
        ],
        [
          { qty: 7, loc: "G-09" },
          { qty: 6, loc: "C-08" },
          { qty: 4, loc: "F-10" }
        ],
        [
          { qty: 8, loc: "D-04" },
          { qty: 3, loc: "D-10" },
          { qty: 11, loc: "A-06" }
        ],
        [
          { qty: 6, loc: "H-02" },
          { qty: 4, loc: "A-10" },
          { qty: 2, loc: "H-10" }
        ]
      ];

      function binY(n) {
        return BACK_Y + (n - 1) * ((FRONT_Y - BACK_Y) / 9);
      }

      function parseLoc(code) {
        var parts = String(code || "").replace(/\$\{|\}\$/g, "").trim().split("-");
        return { aisle: parts[0], bin: parseInt(parts[1], 10) };
      }

      function cleanLoc(code) {
        return String(code || "").replace(/\$\{|\}\$/g, "").trim();
      }

      function xy(code) {
        var loc = parseLoc(code);
        return [AISLE_X[loc.aisle], binY(loc.bin)];
      }

      function corridorY(fromCode, toCode) {
        var a = parseLoc(fromCode);
        var b = parseLoc(toCode);
        var y1 = binY(a.bin);
        var y2 = binY(b.bin);
        var viaBack = Math.abs(y1 - BACK_Y) + Math.abs(y2 - BACK_Y);
        var viaFront = Math.abs(y1 - FRONT_Y) + Math.abs(y2 - FRONT_Y);
        return viaBack <= viaFront ? BACK_Y : FRONT_Y;
      }

      function segment(fromCode, toCode) {
        var p1 = xy(fromCode);
        var p2 = xy(toCode);
        if (fromCode.charAt(0) === toCode.charAt(0)) return [p1, p2];
        var via = corridorY(fromCode, toCode);
        var pts = [p1];
        if (Math.abs(p1[1] - via) > 1) pts.push([p1[0], via]);
        pts.push([p2[0], via]);
        if (Math.abs(p2[1] - via) > 1) pts.push(p2);
        return pts;
      }

      function toPath(points) {
        if (!points.length) return "";
        var d = "M " + points[0][0].toFixed(1) + " " + points[0][1].toFixed(1);
        var i;
        for (i = 1; i < points.length; i += 1) {
          d += " L " + points[i][0].toFixed(1) + " " + points[i][1].toFixed(1);
        }
        return d;
      }

      function runPath(stops) {
        var pts = [];
        var i;
        for (i = 0; i < stops.length - 1; i += 1) {
          var seg = segment(stops[i].loc, stops[i + 1].loc);
          if (!pts.length) pts = seg.slice();
          else pts = pts.concat(seg.slice(1));
        }
        return pts;
      }

      function frameLeg(stops, index) {
        var hereStop = stops[index];
        var next = stops[index + 1];
        var pts = next
          ? segment(hereStop.loc, next.loc)
          : [xy(hereStop.loc)];
        var xs = pts.map(function (p) { return p[0]; });
        var ys = pts.map(function (p) { return p[1]; });
        var minX = Math.min.apply(null, xs) - 88;
        var maxX = Math.max.apply(null, xs) + 96;
        var minY = Math.min.apply(null, ys) - 92;
        var maxY = Math.max.apply(null, ys) + 140;
        var w = Math.max(248, Math.min(308, maxX - minX));
        var h = Math.max(430, Math.min(560, maxY - minY));
        if (w / h > ASPECT) h = w / ASPECT;
        else w = h * ASPECT;
        var cx = (minX + maxX) / 2;
        var cy = (minY + maxY) / 2 + 8;
        return [cx - w / 2, cy - h / 2, w, h];
      }

      function boxString(box) {
        return box.map(function (n) { return n.toFixed(1); }).join(" ");
      }

      function easeOut(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function mixBox(a, b, t) {
        return a.map(function (v, i) { return v + (b[i] - v) * t; });
      }

      function fmtTime(ms) {
        var total = Math.max(0, Math.round(ms / 1000));
        var m = Math.floor(total / 60);
        var s = total % 60;
        return m + ":" + (s < 10 ? "0" : "") + s;
      }

      var app = document.getElementById("app");
      var svg = document.getElementById("route-svg");
      var aisleEl = document.getElementById("aisle-pills");
      var segsEl = document.getElementById("route-segs");
      var nodesEl = document.getElementById("route-nodes");
      var countEl = document.getElementById("count");
      var qtyEl = document.getElementById("qty");
      var locEl = document.getElementById("loc");
      var depoisEl = document.getElementById("depois");
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      aisleEl.innerHTML = Object.keys(AISLE_X).map(function (key) {
        var x = AISLE_X[key];
        return '<rect class="aisle-pill" x="' + (x - 13).toFixed(1) + '" y="36" width="26" height="628" rx="13"></rect>';
      }).join("");

      var phase = PHASES.open;
      var claimed = [];
      var runIndex = -1;
      var here = 0;
      var misses = {};
      var startedAt = 0;
      var viewBox = WIDE.slice();
      var vbToken = 0;

      function freeIndexes() {
        return RUNS.map(function (_, i) { return i; }).filter(function (i) {
          return claimed.indexOf(i) === -1;
        });
      }

      function startedOnce() {
        return claimed.length > 0;
      }

      function overviewStroke(i) {
        return startedOnce() ? COLORS[i] : TOUR_PALETTE[0];
      }

      function pathLengthPx(node) {
        var len = 0;
        try { len = node.getTotalLength() || 0; } catch (err) { return 0; }
        var ctm = node.getScreenCTM && node.getScreenCTM();
        if (ctm) return len * ((Math.hypot(ctm.a, ctm.b) + Math.hypot(ctm.c, ctm.d)) / 2);
        return len;
      }

      function walkDurationMs(node) {
        return Math.max(WAVE_GAP_MS, pathLengthPx(node) / WALK_PX_PER_MS);
      }

      function setPhase(next) {
        assertPhase(next);
        phase = next;
        app.className = "app is-" + next;
        if (next === PHASES.zen && freeIndexes().length) app.classList.add("has-free");
        var color = runIndex >= 0
          ? COLORS[runIndex]
          : (startedOnce() ? COLORS[freeIndexes()[0] || 0] : TOUR_PALETTE[0]);
        document.documentElement.style.setProperty("--run", color);
      }

      function assertPhase(value) {
        switch (value) {
          case PHASES.open:
          case PHASES.pick:
          case PHASES.zen:
          case PHASES.empty:
            return value;
          default: {
            var unknown = value;
            throw new Error("fase desconhecida: " + String(unknown));
          }
        }
      }

      function animateView(toBox) {
        if (reduce) {
          viewBox = toBox.slice();
          svg.setAttribute("viewBox", boxString(viewBox));
          return;
        }
        var from = viewBox.slice();
        var t0 = performance.now();
        var token = (vbToken += 1);
        function tick(now) {
          if (token !== vbToken) return;
          var t = Math.min(1, (now - t0) / 680);
          viewBox = mixBox(from, toBox, easeOut(t));
          svg.setAttribute("viewBox", boxString(viewBox));
          if (t < 1) window.requestAnimationFrame(tick);
        }
        window.requestAnimationFrame(tick);
      }

      function paintOpenPaths() {
        var html = "";
        var i;
        for (i = 0; i < RUNS.length; i += 1) {
          var taken = claimed.indexOf(i) !== -1;
          html +=
            '<path class="path-run' + (taken ? " is-taken" : "") + '" stroke="' +
            overviewStroke(i) + '" d="' + toPath(runPath(RUNS[i])) + '"></path>';
        }
        segsEl.innerHTML = html;
        var nodes = "";
        for (i = 0; i < RUNS.length; i += 1) {
          RUNS[i].forEach(function (stop) {
            var p = xy(stop.loc);
            nodes +=
              '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) +
              '" r="5.5" fill="' + overviewStroke(i) + '" opacity="' +
              (claimed.indexOf(i) !== -1 ? "0.28" : "0.95") + '"></circle>';
          });
        }
        nodesEl.innerHTML = nodes;
      }

      function paintPickPaths(drawNow) {
        var stops = RUNS[runIndex];
        var color = COLORS[runIndex];
        var html = "";
        var i;
        for (i = 0; i < stops.length - 1; i += 1) {
          var cls = "path-ahead";
          var attrs = "";
          if (i < here) {
            cls = "path-done";
          } else if (i === here) {
            cls = "path-ahead";
          }
          html +=
            '<path class="' + cls + '"' + attrs + ' stroke="' + color +
            '" d="' + toPath(segment(stops[i].loc, stops[i + 1].loc)) + '"></path>';
        }
        segsEl.innerHTML = html;
        if (!reduce) {
          Array.prototype.forEach.call(segsEl.querySelectorAll(".path-ahead"), function (node) {
            node.style.strokeLinecap = "butt";
            node.style.setProperty("--walk-cycle", "-25");
            node.style.animation = "walk-dash " + (walkDurationMs(node) + WAVE_LOOP_PAUSE_MS) + "ms linear infinite";
          });
        }

        var nodes = "";
        for (i = 0; i < stops.length; i += 1) {
          var p = xy(stops[i].loc);
          var x = p[0].toFixed(1);
          var y = p[1].toFixed(1);
          if (i === here) {
            nodes += '<circle class="here-ring" cx="' + x + '" cy="' + y + '" r="15"></circle>';
            nodes += '<circle class="node-here" cx="' + x + '" cy="' + y + '" r="8"></circle>';
          } else if (i === here + 1) {
            nodes += '<circle class="node-next" cx="' + x + '" cy="' + y + '" r="6.5"></circle>';
          } else if (i < here) {
            nodes +=
              '<circle class="' + (misses[i] ? "node-miss" : "node-done") +
              '" cx="' + x + '" cy="' + y + '" r="5.5"></circle>';
          } else {
            nodes += '<circle class="node-future" cx="' + x + '" cy="' + y + '" r="5"></circle>';
          }
        }
        nodesEl.innerHTML = nodes;
      }

      function paintHud() {
        if (phase !== PHASES.pick) {
          countEl.textContent = "";
          return;
        }
        var stops = RUNS[runIndex];
        var stop = stops[here];
        var next = stops[here + 1];
        qtyEl.textContent = String(stop.qty);
        locEl.textContent = cleanLoc(stop.loc);
        depoisEl.textContent = next ? "depois " + cleanLoc(next.loc) : "última parada";
        countEl.textContent = (here + 1) + " de " + stops.length;
      }

      function paintZen() {
        var stops = RUNS[runIndex];
        var qty = 0;
        var miss = 0;
        var i;
        for (i = 0; i < stops.length; i += 1) {
          if (misses[i]) miss += 1;
          else qty += stops[i].qty;
        }
        document.getElementById("zen-kicker").textContent = "Corrida " + (runIndex + 1);
        document.getElementById("m-time").textContent = fmtTime(Date.now() - startedAt);
        document.getElementById("m-qty").textContent = qty + " un.";
        document.getElementById("m-miss").textContent = String(miss);
        document.getElementById("m-stops").textContent = String(stops.length);
      }

      function snapWide() {
        vbToken += 1;
        viewBox = WIDE.slice();
        svg.setAttribute("viewBox", boxString(viewBox));
      }

      function render(fly, drawNow) {
        assertPhase(phase);
        if (phase === PHASES.open || phase === PHASES.empty || phase === PHASES.zen) {
          paintOpenPaths();
          snapWide();
          paintHud();
          return;
        }
        paintPickPaths(Boolean(drawNow));
        paintHud();
        var dest = frameLeg(RUNS[runIndex], here);
        if (fly) animateView(dest);
        else {
          vbToken += 1;
          viewBox = dest.slice();
          svg.setAttribute("viewBox", boxString(viewBox));
        }
      }

      function enterPick(index, fly) {
        runIndex = index;
        here = 0;
        misses = {};
        startedAt = Date.now();
        setPhase(PHASES.pick);
        render(fly, true);
      }

      function finishRun() {
        if (!freeIndexes().length) {
          setPhase(PHASES.empty);
          render(false, false);
          return;
        }
        setPhase(PHASES.zen);
        paintZen();
        render(false, false);
      }

      function advance(kind) {
        if (phase !== PHASES.pick) return;
        if (kind === "miss") misses[here] = true;
        var stops = RUNS[runIndex];
        if (here >= stops.length - 1) {
          finishRun();
          return;
        }
        here += 1;
        paintPickPaths(true);
        paintHud();
        animateView(frameLeg(stops, here));
      }

      function claim() {
        if (phase !== PHASES.open) return;
        var free = freeIndexes();
        if (!free.length) {
          setPhase(PHASES.empty);
          render(false, false);
          return;
        }
        claimed.push(free[0]);
        enterPick(free[0], true);
      }

      function again() {
        if (!freeIndexes().length) {
          setPhase(PHASES.empty);
          render(false, false);
          return;
        }
        runIndex = -1;
        here = 0;
        setPhase(PHASES.open);
        render(false, false);
      }

      function bootFromQuery() {
        var params = new URLSearchParams(window.location.search);
        if (params.get("vazio") === "1" || params.get("empty") === "1") {
          claimed = RUNS.map(function (_, i) { return i; });
          setPhase(PHASES.empty);
          render(false, false);
          return true;
        }
        return false;
      }

      document.getElementById("btn-iniciar").addEventListener("click", claim);
      document.getElementById("btn-feito").addEventListener("click", function () {
        advance("ok");
      });
      document.getElementById("btn-miss").addEventListener("click", function () {
        advance("miss");
      });
      document.getElementById("btn-again").addEventListener("click", again);

      svg.setAttribute("viewBox", boxString(WIDE));
      if (!bootFromQuery()) {
        setPhase(PHASES.open);
        render(false, false);
      }
    })();
  </script>
</body>
</html>
