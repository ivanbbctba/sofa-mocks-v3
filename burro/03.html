<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Onda 14</title>
  <style>
    :root {
      --paper: #f7f6f2;
      --surface: #fffcf8;
      --ink: #1a1b1a;
      --ink-2: #3c3e3c;
      --muted: #6d706c;
      --mute: #6d706c;
      --faint: #9a9c98;
      --line: #e3e1da;
      --accent: #4f8a78;
      --accent-soft: #dce8e3;
      --go: #0f766e;
      --warn: #b45309;
      --floor: #efe8dc;
      --run: #635bff;
      --leg-1: #635bff;
      --leg-2: #059669;
      --leg-3: #ea580c;
      --leg-4: #9333ea;
      --leg-5: #e11d48;
      --leg-6: #0284c8;
      --white: #fffcf8;
      --feito: #1a1b1a;
      --ok: #0f766e;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      font: 17px/1.3 "SF Pro Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: #e3e1da;
    }

    .phone {
      position: relative;
      width: 100%;
      max-width: 390px;
      height: 100dvh;
      max-height: 844px;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(120% 70% at 50% 0%, rgba(255, 252, 248, 0.72), transparent 58%),
        var(--floor);
    }

    @media (min-height: 900px) {
      body {
        display: grid;
        place-items: center;
      }
      .phone {
        height: 844px;
        border-radius: 28px;
        box-shadow: 0 18px 50px rgba(17, 19, 24, 0.16);
      }
    }

    .map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .map svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .aisle { fill: #e3e1da; }
    .u-arm { fill: #f3efe6; }
    .u-cross { fill: #ebe4d6; }
    .yard-void { fill: #efe8dc; }

    .path-rest {
      fill: none;
      stroke: var(--run);
      stroke-width: 0.22;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.14;
    }

    .path-done {
      fill: none;
      stroke: var(--run);
      stroke-width: 0.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.78;
    }

    .path-play {
      fill: none;
      stroke: var(--run);
      stroke-width: 0.52;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .path-play.is-draw {
      stroke-dasharray: var(--len);
      stroke-dashoffset: var(--len);
    }

    .path-dash {
      fill: none;
      stroke: var(--run);
      stroke-width: 0.32;
      stroke-linecap: butt;
      stroke-linejoin: round;
      stroke-dasharray: 0.34 0.26;
      opacity: 0.7;
    }

    .path-ghost {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 0.28;
      opacity: 0.78;
    }

    .path-claimed {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 0.24;
      opacity: 0.26;
    }

    .node-done { fill: #9a9c98; }
    .node-future { fill: #e3e1da; opacity: 0.5; }
    .node-skip {
      fill: none;
      stroke: var(--run);
      stroke-width: 0.08;
      opacity: 0.55;
    }
    .node-next {
      fill: #fff;
      stroke: var(--run);
      stroke-width: 0.09;
    }
    .node-here { fill: var(--ok); }
    .node-halo {
      fill: none;
      stroke: var(--ok);
      stroke-width: 0.07;
      opacity: 0.4;
    }

    .chrome {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .chrome button { pointer-events: auto; }

    .count {
      position: absolute;
      top: calc(12px + var(--safe-t));
      right: 16px;
      margin: 0;
      color: var(--mute);
      font-size: 13px;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .dock {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0 20px calc(18px + var(--safe-b));
      background: linear-gradient(
        180deg,
        rgba(247, 246, 242, 0) 0%,
        rgba(247, 246, 242, 0.78) 36%,
        #f7f6f2 100%
      );
    }

    .phone[data-fase="overview"] .dock,
    .phone[data-fase="taken"] .dock {
      background: linear-gradient(
        180deg,
        rgba(247, 246, 242, 0) 0%,
        rgba(247, 246, 242, 0.55) 48%,
        rgba(247, 246, 242, 0.92) 100%
      );
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 12px;
    }

    .qty {
      margin: 0;
      font-size: 72px;
      font-weight: 650;
      letter-spacing: -0.07em;
      line-height: 0.86;
      font-variant-numeric: tabular-nums;
    }

    .loc {
      margin: 8px 0 0;
      font-size: 18px;
      font-weight: 560;
      letter-spacing: -0.02em;
    }

    .depois,
    .speek {
      margin: 3px 0 0;
      color: var(--mute);
      font-size: 14px;
    }

    .speek { max-width: 13.5rem; }

    .hud > div:first-child { padding-right: 8px; }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 4px;
    }

    .btn-iniciar,
    .btn-feito,
    .btn-again,
    .btn-miss {
      border: 0;
      cursor: pointer;
      font: inherit;
      letter-spacing: -0.03em;
    }

    .btn-iniciar,
    .btn-feito {
      border-radius: 50%;
      color: #fff;
    }

    .btn-iniciar {
      width: 104px;
      height: 104px;
      background: var(--accent);
      font-weight: 650;
      font-size: 17px;
      box-shadow: 0 14px 28px rgba(20, 21, 26, 0.2);
    }

    .btn-feito {
      width: 76px;
      height: 76px;
      background: var(--accent);
      font-weight: 650;
      font-size: 15px;
      box-shadow: 0 10px 24px rgba(17, 19, 24, 0.22);
    }

    .btn-miss {
      background: transparent;
      color: var(--mute);
      font-size: 14px;
      font-weight: 560;
      padding: 10px 2px;
    }

    .btn-again {
      width: 100%;
      margin-top: 16px;
      height: 52px;
      border-radius: 999px;
      background: var(--feito);
      color: #fff;
      font-weight: 650;
      font-size: 16px;
    }

    .btn-iniciar:active,
    .btn-feito:active,
    .btn-again:active { transform: scale(0.96); }

    .empty {
      margin: 0 0 28px;
      color: var(--ink);
      font-size: 28px;
      font-weight: 560;
      letter-spacing: -0.04em;
      text-align: center;
    }

    .zen {
      width: 100%;
      padding: 18px 16px 8px;
      border-radius: 22px;
      background: var(--white);
      box-shadow: 0 12px 32px rgba(16, 18, 24, 0.1);
    }

    .zen-kicker {
      margin: 0;
      color: var(--mute);
      font-size: 12px;
    }

    .zen-title {
      margin: 4px 0 0;
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -0.04em;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 0 0;
    }

    .stat {
      margin: 0;
      padding: 10px 12px;
      border-radius: 14px;
      background: #efe8dc;
    }

    .stat b {
      display: block;
      font-size: 20px;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .stat span {
      color: var(--mute);
      font-size: 12px;
    }

    .phone[data-fase="overview"] .is-pick,
    .phone[data-fase="overview"] .is-taken,
    .phone[data-fase="overview"] .is-zen,
    .phone[data-fase="taken"] .is-overview,
    .phone[data-fase="taken"] .is-pick,
    .phone[data-fase="taken"] .is-zen,
    .phone[data-fase="pick"] .is-overview,
    .phone[data-fase="pick"] .is-taken,
    .phone[data-fase="pick"] .is-zen,
    .phone[data-fase="zen"] .is-overview,
    .phone[data-fase="zen"] .is-taken,
    .phone[data-fase="zen"] .is-pick { display: none; }

    @keyframes walk-dash {
      to { stroke-dashoffset: var(--walk-cycle, -0.6); }
    }

    @media (prefers-reduced-motion: reduce) {
      .path-dash,
      .path-play.is-draw {
        animation: none !important;
        transition: none !important;
      }
      .path-play.is-draw {
        stroke-dasharray: none !important;
        stroke-dashoffset: 0 !important;
      }
    }
  </style>
</head>
<body>
  <div class="phone" id="app" data-fase="overview">
    <div class="map" id="map" role="img" aria-label="Mapa do galpão"></div>
    <div class="chrome">
      <p class="count is-pick" id="count">0 de 4</p>
      <div class="dock">
        <p class="empty is-taken">Todos pegos</p>
        <button type="button" class="btn-iniciar is-overview" id="btn-iniciar">Iniciar</button>

        <div class="hud is-pick">
          <div>
            <p class="qty" id="qty">10</p>
            <p class="loc" id="loc">A-01</p>
            <p class="depois" id="depois">depois C-02</p>
            <p class="speek" id="speek">Dez toalhas 220 no A-01.</p>
          </div>
          <div class="actions">
            <button type="button" class="btn-miss" id="btn-miss">Não achei</button>
            <button type="button" class="btn-feito" id="btn-feito">Feito</button>
          </div>
        </div>

        <section class="zen is-zen">
          <p class="zen-kicker">Corrida</p>
          <h1 class="zen-title">Feita</h1>
          <div class="stats">
            <p class="stat"><b id="zen-time">0:00</b><span>tempo</span></p>
            <p class="stat"><b id="zen-qty">0 un.</b><span>quantidade</span></p>
            <p class="stat"><b id="zen-kg">0 kg</b><span>peso</span></p>
            <p class="stat"><b id="zen-m3">0 m³</b><span>volume</span></p>
          </div>
          <p class="depois" id="zen-aceite" style="margin-top:10px">aceite 0,0 s</p>
          <button type="button" class="btn-again" id="btn-again">Começar de novo</button>
        </section>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var TOUR_PALETTE = ["#635bff", "#059669", "#ea580c", "#9333ea", "#e11d48", "#0284c8"];
      var COLORS = TOUR_PALETTE;
      var WALK_PX_PER_MS = 0.26;
      var WAVE_GAP_MS = 800;
      var WAVE_LOOP_PAUSE_MS = 1000;
      var AISLE_X = { A: 0.92, B: 1.88, C: 2.84, D: 3.80, E: 5.70, F: 6.66, G: 7.62, H: 8.58 };
      var Y0 = 2.35;
      var Y1 = 13.15;
      var TOP = 1.35;
      var BOT = 14.15;
      var NS = "http://www.w3.org/2000/svg";
      var FULL_VB = [-1.6, -1.4, 12.7, 18.6];
      var RUNS = [
        [
          { loc: "A-01", qty: 10, sku: "TOALHA-220", kg: 4.8, m3: 0.09, speek: "Dez toalhas 220 no A-01." },
          { loc: "C-02", qty: 8, sku: "JOGO-LENCOL", kg: 6.1, m3: 0.12, speek: "Oito jogos de lençol no C-02." },
          { loc: "E-01", qty: 10, sku: "FRONHA-PAR", kg: 2.4, m3: 0.05, speek: "Dez pares de fronha no E-01." },
          { loc: "E-10", qty: 6, sku: "COBERTOR-CAS", kg: 7.2, m3: 0.16, speek: "Seis cobertores casal no E-10." }
        ],
        [
          { loc: "F-02", qty: 42, sku: "KIT-HIGIENE", kg: 9.4, m3: 0.11, speek: "Quarenta e dois kits higiene no F-02." },
          { loc: "H-09", qty: 3, sku: "SABONETE", kg: 0.9, m3: 0.02, speek: "Três sabonetes no H-09." },
          { loc: "H-03", qty: 12, sku: "SHAMPOO-400", kg: 5.1, m3: 0.07, speek: "Doze shampoos 400 no H-03." },
          { loc: "G-01", qty: 7, sku: "CREME-HID", kg: 3.3, m3: 0.04, speek: "Sete cremes hidratantes no G-01." }
        ],
        [
          { loc: "B-09", qty: 5, sku: "ESC-DENTES", kg: 0.6, m3: 0.01, speek: "Cinco escovas de dente no B-09." },
          { loc: "C-08", qty: 6, sku: "PILLOW-TOP", kg: 8.8, m3: 0.22, speek: "Seis pillow tops no C-08." },
          { loc: "F-10", qty: 9, sku: "TAPETE-BAN", kg: 6.4, m3: 0.14, speek: "Nove tapetes de banho no F-10." },
          { loc: "D-04", qty: 2, sku: "CORTINA-180", kg: 3.9, m3: 0.1, speek: "Duas cortinas 180 no D-04." }
        ],
        [
          { loc: "D-09", qty: 15, sku: "TOALHA-MAO", kg: 3.1, m3: 0.06, speek: "Quinze toalhas de mão no D-09." },
          { loc: "A-08", qty: 1, sku: "ROUPAO-M", kg: 0.8, m3: 0.03, speek: "Um roupão M no A-08." },
          { loc: "B-02", qty: 11, sku: "SACO-LIXO", kg: 2.2, m3: 0.05, speek: "Onze sacos de lixo no B-02." },
          { loc: "H-01", qty: 8, sku: "PAPEL-HIG", kg: 4.0, m3: 0.08, speek: "Oito papéis higiênicos no H-01." }
        ],
        [
          { loc: "G-05", qty: 3, sku: "AMACIANTE", kg: 3.6, m3: 0.04, speek: "Três amaciantes no G-05." },
          { loc: "G-08", qty: 4, sku: "ALGODAO", kg: 0.5, m3: 0.02, speek: "Quatro pacotes de algodão no G-08." },
          { loc: "E-05", qty: 14, sku: "LENCOL-SOLT", kg: 5.7, m3: 0.13, speek: "Quatorze lençóis solteiro no E-05." },
          { loc: "C-04", qty: 9, sku: "CAPA-TRV", kg: 2.8, m3: 0.07, speek: "Nove capas de travesseiro no C-04." }
        ],
        [
          { loc: "A-05", qty: 16, sku: "TOALHA-PISO", kg: 6.8, m3: 0.15, speek: "Dezesseis toalhas de piso no A-05." },
          { loc: "B-06", qty: 4, sku: "KIT-BANHO", kg: 4.5, m3: 0.09, speek: "Quatro kits banho no B-06." },
          { loc: "D-02", qty: 7, sku: "EDREDOM", kg: 8.1, m3: 0.19, speek: "Sete edredons no D-02." },
          { loc: "F-06", qty: 5, sku: "PORTA-TRV", kg: 1.7, m3: 0.04, speek: "Cinco porta-travesseiros no F-06." }
        ]
      ];

      function slotY(n) {
        return Y0 + ((n - 1) * (Y1 - Y0)) / 9;
      }

      function parseCode(code) {
        return { aisle: code[0], n: Number(code.slice(2)) };
      }

      function xy(code) {
        var parsed = parseCode(code);
        return { x: AISLE_X[parsed.aisle], y: slotY(parsed.n), aisle: parsed.aisle, n: parsed.n };
      }

      function hop(a, b) {
        if (a.aisle === b.aisle) return [a, { x: a.x, y: b.y }];
        var mid = (Y0 + Y1) / 2;
        var sameTop = a.y <= mid && b.y <= mid;
        var sameBot = a.y >= mid && b.y >= mid;
        var end;
        if (sameTop) end = Math.min(a.y, b.y) - 0.7;
        else if (sameBot) end = Math.max(a.y, b.y) + 0.7;
        else {
          var viaTop = Math.abs(a.y - TOP) + Math.abs(b.y - TOP);
          var viaBot = Math.abs(a.y - BOT) + Math.abs(b.y - BOT);
          end = viaTop <= viaBot ? TOP : BOT;
        }
        end = Math.max(TOP, Math.min(BOT, end));
        return [a, { x: a.x, y: end }, { x: b.x, y: end }, { x: b.x, y: b.y }];
      }

      function samePoint(p, q) {
        return Math.abs(p.x - q.x) < 0.001 && Math.abs(p.y - q.y) < 0.001;
      }

      function joinHops(hops) {
        var out = [];
        hops.forEach(function (seg) {
          seg.forEach(function (p, i) {
            if (i === 0 && out.length && samePoint(out[out.length - 1], p)) return;
            out.push(p);
          });
        });
        return out;
      }

      function geometryFor(stops) {
        var points = stops.map(function (stop) { return xy(stop.loc); });
        var hops = points.slice(1).map(function (pt, i) { return hop(points[i], pt); });
        var fullPath = hops.length ? joinHops(hops) : points.slice();
        return { points: points, hops: hops, fullPath: fullPath };
      }

      var tours = RUNS.map(function (stops, i) {
        return { color: COLORS[i], stops: stops, geo: geometryFor(stops) };
      });

      function pts(list) {
        return list.map(function (p) { return p.x + " " + p.y; }).join(" ");
      }

      function el(name, attrs) {
        var node = document.createElementNS(NS, name);
        Object.keys(attrs).forEach(function (key) {
          node.setAttribute(key, String(attrs[key]));
        });
        return node;
      }

      function fmtTime(ms) {
        var total = Math.max(0, Math.round(ms / 1000));
        return Math.floor(total / 60) + ":" + String(total % 60).padStart(2, "0");
      }

      function fmtLat(ms) {
        return (Math.max(0, ms) / 1000).toFixed(1).replace(".", ",") + " s";
      }

      function fmtNum(n, digits) {
        return n.toFixed(digits).replace(".", ",");
      }

      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var app = document.getElementById("app");
      var map = document.getElementById("map");
      var countEl = document.getElementById("count");
      var qtyEl = document.getElementById("qty");
      var locEl = document.getElementById("loc");
      var depoisEl = document.getElementById("depois");
      var speekEl = document.getElementById("speek");
      var feitoEl = document.getElementById("btn-feito");
      var againEl = document.getElementById("btn-again");

      var fase = "overview";
      var claimed = [];
      var runIndex = -1;
      var here = 0;
      var skipped = {};
      var openedAt = Date.now();
      var acceptMs = 0;
      var pickStartedAt = 0;
      var viewBox = FULL_VB.slice();
      var vbTimer = 0;

      function freeIndexes() {
        return tours.map(function (_, i) { return i; }).filter(function (i) {
          return claimed.indexOf(i) === -1;
        });
      }

      function currentTour() {
        return runIndex >= 0 ? tours[runIndex] : null;
      }

      function setFase(next) {
        switch (next) {
          case "overview":
          case "taken":
          case "pick":
          case "zen":
            fase = next;
            break;
          default:
            fase = "overview";
        }
        app.setAttribute("data-fase", fase);
      }

      function setColor(color) {
        document.documentElement.style.setProperty("--run", color);
      }

      function pathLengthPx(node) {
        var len = 0;
        try { len = node.getTotalLength() || 0; } catch (err) { return 0; }
        var ctm = node.getScreenCTM && node.getScreenCTM();
        if (ctm) return len * ((Math.hypot(ctm.a, ctm.b) + Math.hypot(ctm.c, ctm.d)) / 2);
        return len;
      }

      function walkDurationMs(node) {
        return Math.max(WAVE_GAP_MS, pathLengthPx(node) / WALK_PX_PER_MS);
      }

      function playWalkDash(node, dash, gap) {
        if (!node) return;
        node.setAttribute("stroke-dasharray", dash + " " + gap);
        node.style.strokeLinecap = "butt";
        if (reduce) return;
        node.style.setProperty("--walk-cycle", String(-(dash + gap)));
        node.style.animation = "walk-dash " + (walkDurationMs(node) + WAVE_LOOP_PAUSE_MS) + "ms linear infinite";
      }

      function playWalkDraw(node) {
        if (!node) return;
        var len = 1;
        try { len = node.getTotalLength() || 1; } catch (err) { len = 1; }
        node.style.setProperty("--len", String(len));
        node.style.strokeDasharray = String(len);
        node.style.strokeDashoffset = String(len);
        if (reduce) {
          node.style.strokeDashoffset = "0";
          return;
        }
        var dur = walkDurationMs(node);
        node.getBoundingClientRect();
        requestAnimationFrame(function () {
          node.style.transition = "stroke-dashoffset " + dur + "ms linear";
          node.style.strokeDashoffset = "0";
        });
      }

      function startedOnce() {
        return claimed.length > 0;
      }

      function overviewStroke(i) {
        return startedOnce() ? COLORS[i] : TOUR_PALETTE[0];
      }

      function activeLegBox() {
        var geo = currentTour().geo;
        var a = geo.points[here];
        var b = here + 1 < geo.points.length ? geo.points[here + 1] : a;
        var hop = geo.hops[Math.min(here, Math.max(0, geo.hops.length - 1))] || [a, b];
        var xs = hop.map(function (p) { return p.x; }).concat([a.x, b.x]);
        var ys = hop.map(function (p) { return p.y; }).concat([a.y, b.y]);
        var minX = Math.min.apply(null, xs) - 2.1;
        var maxX = Math.max.apply(null, xs) + 2.4;
        var minY = Math.min.apply(null, ys) - 2.0;
        var maxY = Math.max.apply(null, ys) + 4.0;
        var w = Math.min(7.5, Math.max(6.0, maxX - minX));
        var h = Math.min(12.0, Math.max(9.8, maxY - minY));
        var aspect = 390 / 844;
        if (w / h > aspect) h = w / aspect;
        else w = h * aspect;
        var cx = (minX + maxX) / 2;
        var cy = (minY + maxY) / 2 + 0.3;
        return [cx - w / 2, cy - h / 2, w, h];
      }

      function applyViewBox(svg, dest, animate) {
        if (!animate || reduce) {
          viewBox = dest.slice();
          svg.setAttribute("viewBox", viewBox.join(" "));
          return;
        }
        var from = viewBox.slice();
        var t0 = performance.now();
        if (vbTimer) cancelAnimationFrame(vbTimer);
        function frame(now) {
          var u = Math.min(1, (now - t0) / 720);
          var e = 1 - Math.pow(1 - u, 3);
          viewBox = from.map(function (v, i) { return v + (dest[i] - v) * e; });
          svg.setAttribute("viewBox", viewBox.join(" "));
          if (u < 1) vbTimer = requestAnimationFrame(frame);
        }
        vbTimer = requestAnimationFrame(frame);
      }

      function paintMap(fly) {
        map.replaceChildren();
        var svg = el("svg", {
          viewBox: viewBox.join(" "),
          preserveAspectRatio: fase === "pick" ? "xMidYMid slice" : "xMidYMid meet",
          "aria-hidden": "true"
        });

        svg.appendChild(el("rect", { class: "u-arm", x: 0.28, y: 0.7, width: 3.95, height: 13.9, rx: 0.28 }));
        svg.appendChild(el("rect", { class: "u-arm", x: 5.28, y: 0.7, width: 3.95, height: 13.9, rx: 0.28 }));
        svg.appendChild(el("rect", { class: "u-cross", x: 0.28, y: 0.7, width: 8.95, height: 2.15, rx: 0.28 }));
        svg.appendChild(el("rect", { class: "yard-void", x: 3.9, y: 8.4, width: 1.7, height: 7.6, rx: 0.2 }));
        Object.keys(AISLE_X).forEach(function (letter) {
          var x = AISLE_X[letter];
          svg.appendChild(el("rect", {
            class: "aisle",
            x: x - 0.26,
            y: 1.55,
            width: 0.52,
            height: 12.2,
            rx: 0.26
          }));
        });

        if (fase === "overview" || fase === "taken") {
          tours.forEach(function (tour, i) {
            if (tour.geo.fullPath.length < 2) return;
            var taken = claimed.indexOf(i) !== -1;
            var hue = overviewStroke(i);
            svg.appendChild(el("polyline", {
              class: taken ? "path-claimed" : "path-ghost",
              points: pts(tour.geo.fullPath),
              stroke: hue
            }));
            tour.geo.points.forEach(function (p) {
              svg.appendChild(el("circle", {
                cx: p.x,
                cy: p.y,
                r: taken ? 0.1 : 0.14,
                fill: hue,
                opacity: taken ? "0.38" : "0.86"
              }));
            });
          });
          map.appendChild(svg);
          applyViewBox(svg, FULL_VB, fly);
          return;
        }

        var tour = currentTour();
        var geo = tour.geo;
        if (geo.fullPath.length > 1) {
          svg.appendChild(el("polyline", { class: "path-rest", points: pts(geo.fullPath) }));
        }
        if (here > 0) {
          var done = [];
          geo.hops.slice(0, here).forEach(function (seg) {
            done = done.concat(seg);
          });
          if (done.length > 1) {
            svg.appendChild(el("polyline", { class: "path-done", points: pts(done) }));
          }
        }
        var playNode = null;
        if (fase === "pick" && here < geo.hops.length) {
          playNode = el("polyline", { class: "path-play", points: pts(geo.hops[here]) });
          svg.appendChild(playNode);
          var ahead = [];
          geo.hops.slice(here + 1).forEach(function (seg) {
            ahead = ahead.concat(seg);
          });
          if (ahead.length > 1) {
            svg.appendChild(el("polyline", { class: "path-dash", points: pts(ahead) }));
          }
        }
        if (fase === "zen") {
          svg.appendChild(el("polyline", { class: "path-done", points: pts(geo.fullPath) }));
        }
        geo.points.forEach(function (p, i) {
          if (fase === "pick" && i === here) {
            svg.appendChild(el("circle", { class: "node-halo", cx: p.x, cy: p.y, r: 0.4 }));
            svg.appendChild(el("circle", { class: "node-here", cx: p.x, cy: p.y, r: 0.2 }));
            return;
          }
          if (fase === "pick" && i === here + 1) {
            svg.appendChild(el("circle", { class: "node-next", cx: p.x, cy: p.y, r: 0.16 }));
            return;
          }
          if (skipped[i]) {
            svg.appendChild(el("circle", { class: "node-skip", cx: p.x, cy: p.y, r: 0.12 }));
            return;
          }
          svg.appendChild(el("circle", {
            class: i < here || fase === "zen" ? "node-done" : "node-future",
            cx: p.x,
            cy: p.y,
            r: i < here ? 0.1 : 0.08
          }));
        });
        map.appendChild(svg);
        applyViewBox(svg, activeLegBox(), fly);
        if (playNode) {
          playNode.classList.add("is-draw");
          playWalkDraw(playNode);
        }
        var dashNode = svg.querySelector(".path-dash");
        if (dashNode) playWalkDash(dashNode, 0.34, 0.26);
      }

      function paintHud() {
        var free = freeIndexes();
        if (fase === "overview") {
          setColor(startedOnce() ? (COLORS[free[0]] || COLORS[0]) : TOUR_PALETTE[0]);
          return;
        }
        if (fase === "taken") {
          setColor("#16181d");
          return;
        }
        var tour = currentTour();
        setColor(tour.color);
        if (fase === "zen") {
          var qty = 0;
          var kg = 0;
          var m3 = 0;
          tour.stops.forEach(function (stop, i) {
            if (skipped[i]) return;
            qty += stop.qty;
            kg += stop.kg;
            m3 += stop.m3;
          });
          document.getElementById("zen-time").textContent = fmtTime(Date.now() - pickStartedAt);
          document.getElementById("zen-qty").textContent = qty + " un.";
          document.getElementById("zen-kg").textContent = fmtNum(kg, 1) + " kg";
          document.getElementById("zen-m3").textContent = fmtNum(m3, 2) + " m³";
          document.getElementById("zen-aceite").textContent = "aceite " + fmtLat(acceptMs);
          againEl.hidden = free.length === 0;
          return;
        }
        var stop = tour.stops[here];
        var next = tour.stops[here + 1];
        qtyEl.textContent = String(stop.qty);
        locEl.textContent = stop.loc;
        depoisEl.textContent = next ? "depois " + next.loc : "última parada";
        speekEl.textContent = stop.speek;
        countEl.textContent = here + " de " + tour.stops.length;
        feitoEl.hidden = false;
        feitoEl.disabled = false;
      }

      function render(fly) {
        paintHud();
        paintMap(fly);
      }

      function enterPick(index, fly) {
        runIndex = index;
        here = 0;
        skipped = {};
        pickStartedAt = Date.now();
        setFase("pick");
        render(fly);
      }

      function advance(miss) {
        if (fase !== "pick") return;
        if (miss) skipped[here] = true;
        var tour = currentTour();
        if (here >= tour.stops.length - 1) {
          setFase("zen");
          render(true);
          return;
        }
        here += 1;
        render(true);
      }

      document.getElementById("btn-iniciar").addEventListener("click", function () {
        var free = freeIndexes();
        if (!free.length) {
          setFase("taken");
          render(false);
          return;
        }
        acceptMs = Date.now() - openedAt;
        claimed.push(free[0]);
        enterPick(free[0], true);
      });

      feitoEl.addEventListener("click", function () {
        advance(false);
      });

      document.getElementById("btn-miss").addEventListener("click", function () {
        advance(true);
      });

      againEl.addEventListener("click", function () {
        if (!freeIndexes().length) {
          setFase("taken");
          render(true);
          return;
        }
        runIndex = -1;
        here = 0;
        skipped = {};
        openedAt = Date.now();
        setFase("overview");
        render(true);
      });

      var boot = new URLSearchParams(window.location.search);
      if (boot.get("fase") === "taken") {
        claimed = [0, 1, 2, 3, 4, 5];
        setFase("taken");
      } else if (boot.get("fase") === "pick") {
        var r = parseInt(boot.get("r") || "0", 10);
        if (isNaN(r) || r < 0 || r > 5) r = 0;
        claimed.push(r);
        acceptMs = 0;
        enterPick(r, false);
        var hopAt = parseInt(boot.get("i") || "0", 10);
        if (!isNaN(hopAt) && hopAt > 0) {
          here = Math.min(hopAt, tours[r].stops.length - 1);
        }
      }
      render(false);
    })();
  </script>
</body>
</html>
