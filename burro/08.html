<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Onda 14 · Burro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --paper: #e8eef4;
      --ink: #141816;
      --mute: #6d746c;
      --line: rgba(20, 24, 22, 0.1);
      --volt: #c6ef2a;
      --volt-ink: #14180a;
      --hot: #e23b2f;
      --white: #f7fff1;
      --feito: #16181d;
      --lane-0: #635bff;
      --lane-1: #22a06b;
      --lane-2: #ff4d3a;
      --lane-3: #1aa3c7;
      --lane-4: #f0a202;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      font: 500 16px/1.3 Manrope, "Segoe UI", system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
    }

    .app {
      position: relative;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background:
        radial-gradient(120% 70% at 50% 0%, rgba(255, 255, 255, 0.78), transparent 58%),
        var(--paper);
    }

    .map {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .stage {
      width: 100%;
      height: 100%;
      transform-origin: 50% 36%;
      transition: transform 0.9s cubic-bezier(.18, .84, .18, 1);
    }

    .stage.is-claim,
    .stage.is-empty,
    .stage.is-zen { transform: scale(1) translateY(-2%); }

    .map svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .aisle {
      fill: #cfd6e3;
    }

    .path-done,
    .path-play,
    .path-next,
    .path-tour {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .path-done {
      stroke-width: 0.34;
      opacity: 0.55;
    }

    .path-tour,
    .path-next,
    .path-play {
      stroke-dasharray: 0.38 0.28;
      animation: dash-crawl 1.05s linear infinite;
    }

    .path-tour {
      stroke-width: 0.3;
      opacity: 0.88;
    }

    .path-next {
      stroke-width: 0.28;
      opacity: 0.7;
    }

    .path-play {
      stroke-width: 0.52;
    }

    .node-done { fill: #b8bcc8; }
    .node-miss { fill: var(--hot); }
    .node-next {
      fill: #fff;
      stroke: currentColor;
      stroke-width: 0.08;
    }
    .node-here { fill: #22a06b; }
    .node-halo {
      fill: none;
      stroke: #22a06b;
      stroke-width: 0.07;
      opacity: 0.45;
    }

    .chrome {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .chrome a,
    .chrome button { pointer-events: auto; }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(12px + env(safe-area-inset-top)) 18px 0;
    }

    .wave-link {
      color: var(--mute);
      text-decoration: none;
      font-size: 13px;
      padding: 6px 2px;
    }

    .wave-link b {
      color: var(--ink);
      font-weight: 800;
    }

    .count {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
    }

    .hud,
    .dock {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 6;
      padding: 0 20px calc(18px + env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .hud {
      background: linear-gradient(
        180deg,
        rgba(232, 238, 244, 0) 0%,
        rgba(232, 238, 244, 0.72) 26%,
        rgba(232, 238, 244, 0.96) 58%,
        var(--paper) 100%
      );
    }

    .dock {
      background: linear-gradient(
        180deg,
        rgba(232, 238, 244, 0) 0%,
        rgba(232, 238, 244, 0.55) 34%,
        var(--paper) 100%
      );
    }

    .hud-grid,
    .dock-inner {
      width: min(28rem, 100%);
      margin: 0 auto;
      pointer-events: auto;
    }

    .hud-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 10px 14px;
    }

    .qty {
      margin: 0;
      font-family: Anton, Impact, sans-serif;
      font-size: clamp(118px, 38vw, 176px);
      line-height: 0.74;
      letter-spacing: -0.04em;
    }

    .units {
      margin: 8px 0 0;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #4f48d4;
    }

    .slot-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: baseline;
      margin-top: 8px;
    }

    .slot {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .sku {
      margin: 0;
      color: var(--mute);
      font-size: 14px;
    }

    .depois {
      margin: 4px 0 0;
      color: var(--mute);
      font-size: 13px;
    }

    .speek {
      grid-column: 1 / -1;
      margin: 8px 0 2px;
    }

    .speek-kicker {
      margin: 0;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #4f48d4;
    }

    .speek-text {
      margin: 3px 0 0;
      font-size: 15px;
      line-height: 1.35;
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding-bottom: 6px;
    }

    .feito,
    .iniciar,
    .again {
      border: 0;
      cursor: pointer;
    }

    .feito {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--feito);
      color: #fff;
      font: 800 16px/1 Manrope, sans-serif;
      letter-spacing: -0.03em;
    }

    .miss {
      border: 0;
      background: transparent;
      color: var(--mute);
      font: 650 13px/1 Manrope, sans-serif;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      padding: 6px;
    }

    .feito:active,
    .iniciar:active,
    .again:active,
    .miss:active { transform: scale(0.96); }

    .dock-kicker {
      margin: 0;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #4f48d4;
      font-size: 13px;
    }

    .dock-title {
      margin: 6px 0 0;
      font-family: Anton, Impact, sans-serif;
      font-size: clamp(64px, 20vw, 96px);
      line-height: 0.84;
      letter-spacing: -0.03em;
    }

    .dock-meta {
      margin: 10px 0 0;
      color: var(--mute);
      font-size: 15px;
    }

    .link-chip {
      display: inline-flex;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
      color: var(--ink);
      font-size: 12px;
    }

    .iniciar,
    .again {
      margin-top: 18px;
      width: 100%;
      height: 56px;
      border-radius: 999px;
      font: 800 17px/1 Manrope, sans-serif;
    }

    .iniciar {
      background: var(--feito);
      color: #fff;
    }

    .again {
      background: transparent;
      color: var(--ink);
      box-shadow: inset 0 0 0 1.5px rgba(22, 24, 29, 0.22);
    }

    .claim[hidden],
    .empty[hidden],
    .zen[hidden],
    .hud[hidden] { display: none; }

    @keyframes dash-crawl {
      to { stroke-dashoffset: -1.32; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="map" role="img" aria-label="Caminho desta onda">
      <div class="stage is-claim" id="stage"></div>
    </div>

    <div class="chrome">
      <div class="top">
        <a class="wave-link" id="wave-link" href="#onda">Onda <b>14</b></a>
        <p class="count" id="count">18 paradas</p>
      </div>
    </div>

    <div class="hud" id="hud" hidden>
      <div class="hud-grid">
        <div>
          <p class="qty" id="qty">10</p>
          <p class="units" id="units">unidades</p>
          <div class="slot-row">
            <p class="slot" id="slot">A-01</p>
            <p class="sku" id="sku">TOALHA-220</p>
          </div>
          <p class="depois" id="depois">depois C-02</p>
        </div>
        <div class="actions">
          <button type="button" class="feito" id="feito">Feito</button>
          <button type="button" class="miss" id="miss">Não achei</button>
        </div>
        <div class="speek">
          <p class="speek-kicker">Speek</p>
          <p class="speek-text" id="speek-text"></p>
        </div>
      </div>
    </div>

    <section class="dock claim" id="claim">
      <div class="dock-inner">
        <p class="dock-kicker">Link da onda</p>
        <h1 class="dock-title">166</h1>
        <p class="dock-meta">unidades · 18 paradas · 8 pedidos · A-01 → G-05</p>
        <span class="link-chip">pisoly.com/r/onda14</span>
        <button type="button" class="iniciar" id="iniciar">Iniciar</button>
      </div>
    </section>

    <section class="dock empty" id="empty" hidden>
      <div class="dock-inner">
        <p class="dock-kicker">Sem onda livre</p>
        <h1 class="dock-title">Todos pegos</h1>
        <p class="dock-meta">Nada para reivindicar neste link.</p>
      </div>
    </section>

    <section class="dock zen" id="zen" hidden>
      <div class="dock-inner">
        <p class="dock-kicker">Onda feita</p>
        <h1 class="dock-title">166</h1>
        <p class="dock-meta" id="zen-meta">unidades · 18 paradas</p>
        <button type="button" class="again" id="again">Começar de novo</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const AISLE_X = { A: 0.78, B: 1.92, C: 3.06, D: 4.2, E: 5.34, F: 6.48, G: 7.62, H: 8.76 };
      const Y0 = 1.55;
      const Y1 = 15.85;
      const TOP = 0.85;
      const BOT = 16.65;
      const NS = "http://www.w3.org/2000/svg";
      const LANES = ["#635bff", "#22a06b", "#ff4d3a", "#1aa3c7", "#f0a202"];
      const UNITS = [
        { code: "A-01", qty: 10, sku: "TOALHA-220" },
        { code: "C-02", qty: 8, sku: "JOGO-LENCOL" },
        { code: "E-01", qty: 10, sku: "FRONHA-PAR" },
        { code: "E-10", qty: 10, sku: "COBERTOR-CAS" },
        { code: "F-02", qty: 42, sku: "KIT-HIGIENE" },
        { code: "H-09", qty: 3, sku: "SABONETE" },
        { code: "H-03", qty: 12, sku: "SHAMPOO-400" },
        { code: "B-09", qty: 5, sku: "ESC-DENTES" },
        { code: "G-01", qty: 7, sku: "CREME-HID" },
        { code: "G-08", qty: 4, sku: "ALGODAO" },
        { code: "C-08", qty: 6, sku: "PILLOW-TOP" },
        { code: "F-10", qty: 9, sku: "TAPETE-BAN" },
        { code: "D-04", qty: 2, sku: "CORTINA-180" },
        { code: "D-09", qty: 15, sku: "TOALHA-MAO" },
        { code: "A-08", qty: 1, sku: "ROUPAO-M" },
        { code: "B-02", qty: 11, sku: "SACO-LIXO" },
        { code: "H-01", qty: 8, sku: "PAPEL-HIG" },
        { code: "G-05", qty: 3, sku: "AMACIANTE" }
      ];

      /**
       * @typedef {"claim" | "run" | "zen" | "empty"} Mode
       */

      function slotY(n) {
        return Y0 + ((n - 1) * (Y1 - Y0)) / 9;
      }

      function parseCode(code) {
        return { aisle: code[0], n: Number(code.slice(2)) };
      }

      function xy(code) {
        const parsed = parseCode(code);
        return { x: AISLE_X[parsed.aisle], y: slotY(parsed.n), aisle: parsed.aisle, n: parsed.n };
      }

      function hop(a, b) {
        if (a.aisle === b.aisle) return [a, { x: a.x, y: b.y }];
        const mid = (Y0 + Y1) / 2;
        const sameTop = a.y <= mid && b.y <= mid;
        const sameBot = a.y >= mid && b.y >= mid;
        let end;
        if (sameTop) {
          end = Math.min(a.y, b.y) - 0.7;
        } else if (sameBot) {
          end = Math.max(a.y, b.y) + 0.7;
        } else {
          const viaTop = Math.abs(a.y - TOP) + Math.abs(b.y - TOP);
          const viaBot = Math.abs(a.y - BOT) + Math.abs(b.y - BOT);
          end = viaTop <= viaBot ? TOP : BOT;
        }
        end = Math.max(TOP, Math.min(BOT, end));
        return [a, { x: a.x, y: end }, { x: b.x, y: end }, { x: b.x, y: b.y }];
      }

      function pts(list) {
        return list.map((p) => p.x + " " + p.y).join(" ");
      }

      function el(name, attrs) {
        const node = document.createElementNS(NS, name);
        Object.keys(attrs).forEach((key) => node.setAttribute(key, String(attrs[key])));
        return node;
      }

      function lane(i) {
        return LANES[i % LANES.length];
      }

      function onesPt(n) {
        switch (n) {
          case 0: return "zero";
          case 1: return "um";
          case 2: return "dois";
          case 3: return "três";
          case 4: return "quatro";
          case 5: return "cinco";
          case 6: return "seis";
          case 7: return "sete";
          case 8: return "oito";
          case 9: return "nove";
          default: {
            const _never = n;
            return String(_never);
          }
        }
      }

      function teensPt(n) {
        switch (n) {
          case 10: return "dez";
          case 11: return "onze";
          case 12: return "doze";
          case 13: return "treze";
          case 14: return "quatorze";
          case 15: return "quinze";
          case 16: return "dezesseis";
          case 17: return "dezessete";
          case 18: return "dezoito";
          case 19: return "dezenove";
          default: {
            const _never = n;
            return String(_never);
          }
        }
      }

      function tensPt(n) {
        switch (n) {
          case 2: return "vinte";
          case 3: return "trinta";
          case 4: return "quarenta";
          case 5: return "cinquenta";
          case 6: return "sessenta";
          case 7: return "setenta";
          case 8: return "oitenta";
          case 9: return "noventa";
          default: {
            const _never = n;
            return String(_never);
          }
        }
      }

      function qtyPt(n) {
        if (n < 10) return onesPt(n);
        if (n < 20) return teensPt(n);
        const ten = Math.floor(n / 10);
        const one = n % 10;
        return one === 0 ? tensPt(ten) : tensPt(ten) + " e " + onesPt(one);
      }

      function speekText(stop) {
        const unit = stop.qty === 1 ? "unidade" : "unidades";
        const spoken = qtyPt(stop.qty);
        return spoken.charAt(0).toUpperCase() + spoken.slice(1) + " " + unit + " · " + stop.code + " · " + stop.sku.replace(/-/g, " ").toLowerCase();
      }

      function isEmptyHash() {
        const hash = (location.hash || "").replace("#", "");
        return hash === "vazio" || hash === "todos-pegos";
      }

      const points = UNITS.map((stop) => xy(stop.code));
      const hops = points.slice(1).map((pt, i) => hop(points[i], pt));

      const stage = document.getElementById("stage");
      const claim = document.getElementById("claim");
      const empty = document.getElementById("empty");
      const zen = document.getElementById("zen");
      const hud = document.getElementById("hud");
      const qtyEl = document.getElementById("qty");
      const unitsEl = document.getElementById("units");
      const slotEl = document.getElementById("slot");
      const skuEl = document.getElementById("sku");
      const depoisEl = document.getElementById("depois");
      const countEl = document.getElementById("count");
      const speekEl = document.getElementById("speek-text");
      const zenMeta = document.getElementById("zen-meta");
      const feitoEl = document.getElementById("feito");

      /** @type {Mode} */
      let mode = "claim";
      let here = 0;
      /** @type {Array<"open" | "feito" | "miss">} */
      let marks = UNITS.map(function () { return "open"; });

      function assertMode(value) {
        switch (value) {
          case "claim":
          case "run":
          case "zen":
          case "empty":
            return value;
          default: {
            const _never = value;
            throw new Error("modo inválido: " + String(_never));
          }
        }
      }

      function focusStage(index, nextMode) {
        const next = assertMode(nextMode);
        stage.classList.remove("is-claim", "is-run", "is-zen", "is-empty");
        stage.classList.add("is-" + next);
        if (next !== "run") {
          stage.style.transform = "";
          return;
        }
        const p = points[index];
        const xShift = ((4.4 - p.x) / 9.55) * 100;
        const yShift = ((6.6 - p.y) / 18.4) * 90;
        stage.style.transform = "translate(" + xShift + "%, " + yShift + "%) scale(1.55)";
      }

      function paintMap() {
        stage.replaceChildren();
        const svg = el("svg", {
          viewBox: "0 0 9.55 18.2",
          preserveAspectRatio: "xMidYMid meet",
          "aria-hidden": "true"
        });

        Object.keys(AISLE_X).forEach(function (letter) {
          svg.appendChild(el("rect", {
            class: "aisle",
            x: AISLE_X[letter] - 0.22,
            y: 0.45,
            width: 0.44,
            height: 16.5,
            rx: 0.22
          }));
        });

        if (mode === "claim" || mode === "empty" || mode === "zen") {
          hops.forEach(function (seg, i) {
            const line = el("polyline", {
              class: mode === "zen" ? "path-done" : "path-tour",
              points: pts(seg)
            });
            line.setAttribute("stroke", lane(i));
            svg.appendChild(line);
          });
        } else {
          hops.forEach(function (seg, i) {
            if (i < here) {
              const line = el("polyline", { class: "path-done", points: pts(seg) });
              line.setAttribute("stroke", lane(i));
              svg.appendChild(line);
              return;
            }
            if (i === here) {
              const line = el("polyline", { class: "path-play", points: pts(seg) });
              line.setAttribute("stroke", lane(i));
              svg.appendChild(line);
              return;
            }
            if (i === here + 1) {
              const line = el("polyline", { class: "path-next", points: pts(seg) });
              line.setAttribute("stroke", lane(i));
              svg.appendChild(line);
            }
          });
        }

        points.forEach(function (p, i) {
          if (mode === "run" && i === here) {
            svg.appendChild(el("circle", { class: "node-halo", cx: p.x, cy: p.y, r: 0.38 }));
            svg.appendChild(el("circle", { class: "node-here", cx: p.x, cy: p.y, r: 0.2 }));
            return;
          }
          if (mode === "run" && i === here + 1) {
            const next = el("circle", { class: "node-next", cx: p.x, cy: p.y, r: 0.16 });
            next.setAttribute("stroke", lane(here));
            svg.appendChild(next);
            return;
          }
          const mark = marks[i];
          svg.appendChild(el("circle", {
            class: mark === "miss" ? "node-miss" : "node-done",
            cx: p.x,
            cy: p.y,
            r: 0.1
          }));
        });

        stage.appendChild(svg);
      }

      function paintHud() {
        if (mode !== "run") return;
        const stop = UNITS[here];
        const next = UNITS[here + 1];
        qtyEl.textContent = String(stop.qty);
        unitsEl.textContent = stop.qty === 1 ? "unidade" : "unidades";
        slotEl.textContent = stop.code;
        skuEl.textContent = stop.sku;
        depoisEl.textContent = next ? "depois " + next.code : "última parada";
        countEl.textContent = (here + 1) + " de " + UNITS.length;
        speekEl.textContent = speekText(stop);
      }

      function setMode(nextMode, index) {
        mode = assertMode(nextMode);
        claim.hidden = mode !== "claim";
        empty.hidden = mode !== "empty";
        zen.hidden = mode !== "zen";
        hud.hidden = mode !== "run";
        if (mode === "claim" || mode === "empty") {
          countEl.textContent = "18 paradas";
        }
        if (mode === "zen") {
          const missed = marks.filter(function (m) { return m === "miss"; }).length;
          countEl.textContent = "18 de 18";
          zenMeta.textContent = "unidades · 18 paradas · " + missed + " sem achar";
        }
        focusStage(index, mode);
        paintMap();
        paintHud();
      }

      function goNext(kind) {
        if (mode !== "run") return;
        marks[here] = kind;
        if (here >= UNITS.length - 1) {
          setMode("zen", here);
          return;
        }
        here += 1;
        setMode("run", here);
      }

      function startRun() {
        here = 0;
        marks = UNITS.map(function () { return "open"; });
        setMode("run", 0);
      }

      function resetWave() {
        here = 0;
        marks = UNITS.map(function () { return "open"; });
        if (location.hash) {
          history.replaceState(null, "", location.pathname + location.search);
        }
        setMode("claim", 0);
      }

      function boot() {
        if (isEmptyHash()) {
          setMode("empty", 0);
          return;
        }
        setMode("claim", 0);
      }

      document.getElementById("iniciar").addEventListener("click", startRun);
      feitoEl.addEventListener("click", function () {
        goNext("feito");
      });
      document.getElementById("miss").addEventListener("click", function () {
        goNext("miss");
      });
      document.getElementById("again").addEventListener("click", resetWave);
      document.getElementById("wave-link").addEventListener("click", function (event) {
        event.preventDefault();
      });
      window.addEventListener("hashchange", boot);

      boot();
    })();
  </script>
</body>
</html>
