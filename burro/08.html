<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Onda 14 · Burro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --court: #101612;
      --court-2: #18201a;
      --ink: #f4f7f0;
      --mute: #8b9386;
      --line: rgba(244, 247, 240, 0.12);
      --volt: #d6ff3e;
      --volt-ink: #11180a;
      --hot: #ff4d3a;
      --ice: #3de8ff;
      --pink: #ff3d9a;
      --amber: #ffb020;
      --white: #f7fff1;
      --feito: #10140f;
      --lane-a: #d6ff3e;
      --lane-b: #3de8ff;
      --lane-c: #ff3d9a;
      --lane-d: #ffb020;
      --lane-e: #7cff8a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--court);
      color: var(--ink);
      font: 500 16px/1.3 Manrope, "Segoe UI", system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
    }

    .app {
      position: relative;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background:
        radial-gradient(90% 46% at 50% 0%, rgba(214, 255, 62, 0.1), transparent 52%),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.015) 0 18px,
          transparent 18px 72px
        ),
        linear-gradient(180deg, #151c16 0%, var(--court) 46%, #0b100d 100%);
    }

    .map {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .stage {
      width: 100%;
      height: 100%;
      transform-origin: 50% 38%;
      transition: transform 0.95s cubic-bezier(.18, .84, .18, 1);
    }

    .stage.is-claim { transform: scale(0.92) translateY(-10%); }
    .stage.is-run { transform: scale(1.42); }
    .stage.is-zen { transform: scale(0.86) translateY(-6%); }

    .map svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .aisle {
      fill: #2d3a30;
      stroke: rgba(214, 255, 62, 0.2);
      stroke-width: 0.04;
    }

    .path-done {
      fill: none;
      stroke-width: 0.34;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.55;
    }

    .path-play {
      fill: none;
      stroke-width: 0.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 0.4 0.26;
      animation: dash-crawl 1.1s linear infinite;
    }

    .path-next {
      fill: none;
      stroke-width: 0.32;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.86;
      stroke-dasharray: 0.22 0.3;
      animation: dash-crawl 1.6s linear infinite;
    }

    .node-done { fill: #3a4438; }
    .node-miss { fill: var(--hot); }
    .node-next {
      fill: none;
      stroke: currentColor;
      stroke-width: 0.08;
    }
    .node-here {
      fill: var(--volt);
      filter: drop-shadow(0 0 0.18px rgba(214, 255, 62, 0.8));
    }
    .node-halo {
      fill: none;
      stroke: var(--volt);
      stroke-width: 0.07;
      opacity: 0.55;
    }

    .chrome {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .chrome a,
    .chrome button { pointer-events: auto; }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(12px + env(safe-area-inset-top)) 18px 0;
    }

    .wave-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--mute);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.01em;
      padding: 6px 2px;
    }

    .wave-link b {
      color: var(--ink);
      font-weight: 700;
    }

    .count {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
    }

    .hud {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 6;
      padding: 0 18px calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(
        180deg,
        rgba(11, 15, 12, 0) 0%,
        rgba(11, 15, 12, 0.72) 28%,
        rgba(11, 15, 12, 0.96) 62%,
        #0b0f0c 100%
      );
      pointer-events: none;
    }

    .hud-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 10px 14px;
      width: min(28rem, 100%);
      margin: 0 auto;
      pointer-events: auto;
    }

    .qty-block { min-width: 0; }

    .qty {
      margin: 0;
      font-family: Anton, Impact, sans-serif;
      font-size: clamp(120px, 40vw, 188px);
      line-height: 0.74;
      letter-spacing: -0.04em;
      font-weight: 400;
      color: var(--white);
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    .qty.is-slam {
      animation: qty-slam 0.42s cubic-bezier(.2, .9, .2, 1);
    }

    .units {
      margin: 8px 0 0;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--volt);
    }

    .slot-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: baseline;
      margin-top: 8px;
    }

    .slot {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .sku {
      margin: 0;
      color: var(--mute);
      font-size: 14px;
    }

    .depois {
      margin: 4px 0 0;
      color: var(--mute);
      font-size: 13px;
    }

    .speek {
      grid-column: 1 / -1;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 10px 0 4px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(18, 24, 20, 0.72);
    }

    .speek-btn {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: var(--volt);
      color: var(--volt-ink);
      cursor: pointer;
    }

    .speek-btn[aria-pressed="true"] {
      box-shadow: 0 0 0 4px rgba(214, 255, 62, 0.18);
    }

    .speek-text {
      margin: 1px 0 0;
      font-size: 14px;
      line-height: 1.4;
      color: var(--ink);
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding-bottom: 8px;
    }

    .feito,
    .iniciar,
    .again {
      border: 0;
      cursor: pointer;
    }

    .feito {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: var(--volt);
      color: var(--volt-ink);
      font: 800 16px/1 Manrope, sans-serif;
      letter-spacing: -0.03em;
      box-shadow: 0 10px 28px rgba(214, 255, 62, 0.22);
    }

    .miss {
      border: 0;
      background: transparent;
      color: #c4cdc0;
      font: 650 13px/1 Manrope, sans-serif;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      padding: 6px;
    }

    .feito:active,
    .iniciar:active,
    .again:active,
    .miss:active { transform: scale(0.96); }

    .stamp {
      position: absolute;
      left: 50%;
      top: 38%;
      z-index: 12;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -40%) rotate(-8deg) scale(0.86);
    }

    .stamp.is-on {
      opacity: 1;
      transform: translate(-50%, -50%) rotate(-8deg) scale(1);
      transition: opacity 0.16s ease, transform 0.22s cubic-bezier(.2, .9, .2, 1);
    }

    .stamp b {
      display: inline-block;
      padding: 8px 14px;
      border: 4px solid var(--volt);
      color: var(--volt);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      background: rgba(11, 15, 12, 0.72);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .claim,
    .zen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 22px calc(28px + env(safe-area-inset-bottom));
      background: linear-gradient(
        180deg,
        rgba(11, 15, 12, 0.15) 0%,
        rgba(11, 15, 12, 0.55) 42%,
        rgba(11, 15, 12, 0.94) 72%,
        #0b0f0c 100%
      );
    }

    .claim[hidden],
    .zen[hidden] { display: none; }

    .kicker {
      margin: 0;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--volt);
      font-size: 13px;
    }

    .claim-title,
    .zen-title {
      margin: 8px 0 0;
      font-family: Anton, Impact, sans-serif;
      font-size: clamp(56px, 18vw, 84px);
      line-height: 0.86;
      letter-spacing: -0.02em;
    }

    .claim-meta,
    .zen-meta {
      margin: 12px 0 0;
      color: var(--mute);
      font-size: 15px;
    }

    .link-chip {
      display: inline-flex;
      margin-top: 16px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 12px;
      letter-spacing: 0.01em;
      background: rgba(18, 24, 20, 0.7);
    }

    .iniciar,
    .again {
      margin-top: 22px;
      width: 100%;
      max-width: 28rem;
      height: 58px;
      border-radius: 999px;
      background: var(--volt);
      color: var(--volt-ink);
      font: 800 17px/1 Manrope, sans-serif;
    }

    .again {
      background: transparent;
      color: var(--ink);
      box-shadow: inset 0 0 0 1.5px rgba(244, 247, 240, 0.28);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    @keyframes dash-crawl {
      to { stroke-dashoffset: -1.2; }
    }

    @keyframes qty-slam {
      0% { transform: scale(1); }
      35% { transform: scale(1.08); color: var(--volt); }
      100% { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage,
      .path-play,
      .path-next,
      .qty.is-slam,
      .stamp {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="map" id="map" role="img" aria-label="Caminho desta onda">
      <div class="stage is-claim" id="stage"></div>
    </div>

    <div class="chrome">
      <div class="top">
        <a class="wave-link" id="wave-link" href="#onda">
          Onda <b>14</b>
        </a>
        <p class="count" id="count">18 paradas</p>
      </div>
    </div>

    <div class="hud" id="hud" hidden>
      <div class="hud-grid">
        <div class="qty-block">
          <p class="qty" id="qty">10</p>
          <p class="units" id="units">unidades</p>
          <div class="slot-row">
            <p class="slot" id="slot">A-01</p>
            <p class="sku" id="sku">TOALHA-220</p>
          </div>
          <p class="depois" id="depois">depois C-02</p>
        </div>
        <div class="actions">
          <button type="button" class="feito" id="feito">Feito</button>
          <button type="button" class="miss" id="miss">Não achei</button>
        </div>
        <div class="speek">
          <button type="button" class="speek-btn" id="speek-btn" aria-pressed="false" aria-label="Falar Speek">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
              <path d="M16.5 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <p class="speek-text" id="speek-text"></p>
        </div>
      </div>
    </div>

    <div class="stamp" id="stamp" aria-hidden="true"><b>Todos pegos</b></div>

    <section class="claim" id="claim">
      <p class="kicker">Link da onda</p>
      <h1 class="claim-title">166</h1>
      <p class="claim-meta">unidades · 18 paradas · 8 pedidos<br/>A-01 → G-05</p>
      <span class="link-chip">pisoly.com/r/onda14</span>
      <button type="button" class="iniciar" id="iniciar">Iniciar</button>
    </section>

    <section class="zen" id="zen" hidden>
      <p class="kicker">Onda feita</p>
      <h1 class="zen-title">166</h1>
      <p class="zen-meta" id="zen-meta">unidades no burro · 18 paradas · 0 sem achar</p>
      <button type="button" class="again" id="again">Começar de novo</button>
    </section>
  </main>

  <script>
    (function () {
      const AISLE_X = { A: 0.78, B: 1.92, C: 3.06, D: 4.2, E: 5.34, F: 6.48, G: 7.62, H: 8.76 };
      const Y0 = 1.55;
      const Y1 = 15.85;
      const TOP = 0.85;
      const BOT = 16.65;
      const NS = "http://www.w3.org/2000/svg";
      const LANES = ["#d6ff3e", "#3de8ff", "#ff3d9a", "#ffb020", "#7cff8a"];
      const UNITS = [
        { code: "A-01", qty: 10, sku: "TOALHA-220", pedido: "1042" },
        { code: "C-02", qty: 8, sku: "JOGO-LENCOL", pedido: "1042" },
        { code: "E-01", qty: 10, sku: "FRONHA-PAR", pedido: "1043" },
        { code: "E-10", qty: 10, sku: "COBERTOR-CAS", pedido: "1043" },
        { code: "F-02", qty: 42, sku: "KIT-HIGIENE", pedido: "1044" },
        { code: "H-09", qty: 3, sku: "SABONETE", pedido: "1044" },
        { code: "H-03", qty: 12, sku: "SHAMPOO-400", pedido: "1045" },
        { code: "B-09", qty: 5, sku: "ESC-DENTES", pedido: "1045" },
        { code: "G-01", qty: 7, sku: "CREME-HID", pedido: "1046" },
        { code: "G-08", qty: 4, sku: "ALGODAO", pedido: "1046" },
        { code: "C-08", qty: 6, sku: "PILLOW-TOP", pedido: "1047" },
        { code: "F-10", qty: 9, sku: "TAPETE-BAN", pedido: "1047" },
        { code: "D-04", qty: 2, sku: "CORTINA-180", pedido: "1048" },
        { code: "D-09", qty: 15, sku: "TOALHA-MAO", pedido: "1048" },
        { code: "A-08", qty: 1, sku: "ROUPAO-M", pedido: "1048" },
        { code: "B-02", qty: 11, sku: "SACO-LIXO", pedido: "1049" },
        { code: "H-01", qty: 8, sku: "PAPEL-HIG", pedido: "1049" },
        { code: "G-05", qty: 3, sku: "AMACIANTE", pedido: "1049" }
      ];

      /**
       * @typedef {"claim" | "run" | "zen"} Mode
       */

      function slotY(n) {
        return Y0 + ((n - 1) * (Y1 - Y0)) / 9;
      }

      function parseCode(code) {
        return { aisle: code[0], n: Number(code.slice(2)) };
      }

      function xy(code) {
        const parsed = parseCode(code);
        return { x: AISLE_X[parsed.aisle], y: slotY(parsed.n), aisle: parsed.aisle, n: parsed.n };
      }

      function hop(a, b) {
        if (a.aisle === b.aisle) return [a, { x: a.x, y: b.y }];
        const mid = (Y0 + Y1) / 2;
        const sameTop = a.y <= mid && b.y <= mid;
        const sameBot = a.y >= mid && b.y >= mid;
        let end;
        if (sameTop) {
          end = Math.min(a.y, b.y) - 0.7;
        } else if (sameBot) {
          end = Math.max(a.y, b.y) + 0.7;
        } else {
          const viaTop = Math.abs(a.y - TOP) + Math.abs(b.y - TOP);
          const viaBot = Math.abs(a.y - BOT) + Math.abs(b.y - BOT);
          end = viaTop <= viaBot ? TOP : BOT;
        }
        end = Math.max(TOP, Math.min(BOT, end));
        return [a, { x: a.x, y: end }, { x: b.x, y: end }, { x: b.x, y: b.y }];
      }

      function samePoint(p, q) {
        return Math.abs(p.x - q.x) < 0.001 && Math.abs(p.y - q.y) < 0.001;
      }

      function joinHops(hops) {
        const out = [];
        hops.forEach((seg) => {
          seg.forEach((p, i) => {
            if (i === 0 && out.length && samePoint(out[out.length - 1], p)) return;
            out.push(p);
          });
        });
        return out;
      }

      function pts(list) {
        return list.map((p) => p.x + " " + p.y).join(" ");
      }

      function el(name, attrs) {
        const node = document.createElementNS(NS, name);
        Object.keys(attrs).forEach((key) => node.setAttribute(key, String(attrs[key])));
        return node;
      }

      function lane(i) {
        return LANES[i % LANES.length];
      }

      function onesPt(n) {
        switch (n) {
          case 0: return "zero";
          case 1: return "um";
          case 2: return "dois";
          case 3: return "três";
          case 4: return "quatro";
          case 5: return "cinco";
          case 6: return "seis";
          case 7: return "sete";
          case 8: return "oito";
          case 9: return "nove";
          default: {
            const _never = n;
            return String(_never);
          }
        }
      }

      function teensPt(n) {
        switch (n) {
          case 10: return "dez";
          case 11: return "onze";
          case 12: return "doze";
          case 13: return "treze";
          case 14: return "quatorze";
          case 15: return "quinze";
          case 16: return "dezesseis";
          case 17: return "dezessete";
          case 18: return "dezoito";
          case 19: return "dezenove";
          default: {
            const _never = n;
            return String(_never);
          }
        }
      }

      function tensPt(n) {
        switch (n) {
          case 2: return "vinte";
          case 3: return "trinta";
          case 4: return "quarenta";
          case 5: return "cinquenta";
          case 6: return "sessenta";
          case 7: return "setenta";
          case 8: return "oitenta";
          case 9: return "noventa";
          default: {
            const _never = n;
            return String(_never);
          }
        }
      }

      function qtyPt(n) {
        if (n < 10) return onesPt(n);
        if (n < 20) return teensPt(n);
        const ten = Math.floor(n / 10);
        const one = n % 10;
        return one === 0 ? tensPt(ten) : tensPt(ten) + " e " + onesPt(one);
      }

      function speakSku(sku) {
        return sku.replace(/-/g, " ").toLowerCase();
      }

      function speekLine(stop) {
        const unit = stop.qty === 1 ? "unidade" : "unidades";
        return qtyPt(stop.qty) + " " + unit + ". " + stop.code.replace("-", " ") + ". " + speakSku(stop.sku) + ".";
      }

      function speekDisplay(stop) {
        const unit = stop.qty === 1 ? "unidade" : "unidades";
        const spoken = qtyPt(stop.qty);
        return spoken.charAt(0).toUpperCase() + spoken.slice(1) + " " + unit + " · " + stop.code + " · " + speakSku(stop.sku);
      }

      const points = UNITS.map((stop) => xy(stop.code));
      const hops = points.slice(1).map((pt, i) => hop(points[i], pt));
      const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const stage = document.getElementById("stage");
      const claim = document.getElementById("claim");
      const zen = document.getElementById("zen");
      const hud = document.getElementById("hud");
      const qtyEl = document.getElementById("qty");
      const unitsEl = document.getElementById("units");
      const slotEl = document.getElementById("slot");
      const skuEl = document.getElementById("sku");
      const depoisEl = document.getElementById("depois");
      const countEl = document.getElementById("count");
      const speekText = document.getElementById("speek-text");
      const speekBtn = document.getElementById("speek-btn");
      const stamp = document.getElementById("stamp");
      const zenMeta = document.getElementById("zen-meta");

      /** @type {Mode} */
      let mode = "claim";
      let here = 0;
      /** @type {Array<"open" | "feito" | "miss">} */
      let marks = UNITS.map(function () { return "open"; });
      let busy = false;

      function assertMode(value) {
        switch (value) {
          case "claim":
          case "run":
          case "zen":
            return value;
          default: {
            const _never = value;
            throw new Error("modo inválido: " + String(_never));
          }
        }
      }

      function focusStage(index, nextMode) {
        const next = assertMode(nextMode);
        stage.classList.remove("is-claim", "is-run", "is-zen");
        stage.classList.add("is-" + next);
        if (next !== "run") {
          stage.style.transform = "";
          return;
        }
        const p = points[index];
        const xShift = ((4.4 - p.x) / 9.55) * 100;
        const yShift = ((6.8 - p.y) / 18.4) * 92;
        stage.style.transform = "translate(" + xShift + "%, " + yShift + "%) scale(1.42)";
      }

      function paintMap() {
        stage.replaceChildren();
        const svg = el("svg", {
          viewBox: "0 0 9.55 18.4",
          preserveAspectRatio: "xMidYMid meet",
          "aria-hidden": "true"
        });

        Object.keys(AISLE_X).forEach(function (letter) {
          svg.appendChild(el("rect", {
            class: "aisle",
            x: AISLE_X[letter] - 0.24,
            y: 0.45,
            width: 0.56,
            height: 16.5,
            rx: 0.26
          }));
        });

        hops.forEach(function (seg, i) {
          const color = lane(i);
          if (i < here) {
            const line = el("polyline", { class: "path-done", points: pts(seg) });
            line.setAttribute("stroke", color);
            svg.appendChild(line);
            return;
          }
          if (i === here && mode === "run") {
            const line = el("polyline", { class: "path-play", points: pts(seg) });
            line.setAttribute("stroke", color);
            svg.appendChild(line);
            return;
          }
          if (i === here + 1 && mode === "run") {
            const line = el("polyline", { class: "path-next", points: pts(seg) });
            line.setAttribute("stroke", color);
            svg.appendChild(line);
          }
        });

        if (mode === "claim" || mode === "zen") {
          hops.forEach(function (seg, i) {
            const line = el("polyline", {
              class: mode === "zen" ? "path-done" : "path-next",
              points: pts(seg)
            });
            line.setAttribute("stroke", lane(i));
            svg.appendChild(line);
          });
        }

        points.forEach(function (p, i) {
          if (mode === "run" && i === here) {
            svg.appendChild(el("circle", { class: "node-halo", cx: p.x, cy: p.y, r: 0.4 }));
            svg.appendChild(el("circle", { class: "node-here", cx: p.x, cy: p.y, r: 0.2 }));
            return;
          }
          if (mode === "run" && i === here + 1) {
            const next = el("circle", { class: "node-next", cx: p.x, cy: p.y, r: 0.16 });
            next.setAttribute("stroke", lane(here));
            svg.appendChild(next);
            return;
          }
          const mark = marks[i];
          const cls = mark === "miss" ? "node-miss" : (mark === "feito" || mode === "zen" ? "node-done" : "node-done");
          svg.appendChild(el("circle", { class: cls, cx: p.x, cy: p.y, r: mark === "open" && mode !== "zen" ? 0.08 : 0.1 }));
        });

        stage.appendChild(svg);
      }

      function paintHud() {
        if (mode !== "run") return;
        const stop = UNITS[here];
        const next = UNITS[here + 1];
        qtyEl.textContent = String(stop.qty);
        unitsEl.textContent = stop.qty === 1 ? "unidade" : "unidades";
        slotEl.textContent = stop.code;
        skuEl.textContent = stop.sku;
        depoisEl.textContent = next ? "depois " + next.code : "última parada";
        countEl.textContent = (here + 1) + " de " + UNITS.length;
        speekText.textContent = speekDisplay(stop);
      }

      function speakCurrent() {
        const stop = UNITS[here];
        if (!stop || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(speekLine(stop));
        utter.lang = "pt-BR";
        utter.rate = 0.96;
        speekBtn.setAttribute("aria-pressed", "true");
        utter.onend = function () {
          speekBtn.setAttribute("aria-pressed", "false");
        };
        window.speechSynthesis.speak(utter);
      }

      function setMode(nextMode, index) {
        mode = assertMode(nextMode);
        claim.hidden = mode !== "claim";
        zen.hidden = mode !== "zen";
        hud.hidden = mode !== "run";
        if (mode === "claim") {
          countEl.textContent = "18 paradas";
        }
        if (mode === "zen") {
          const missed = marks.filter(function (m) { return m === "miss"; }).length;
          countEl.textContent = "18 de 18";
          zenMeta.textContent = "unidades no burro · " + UNITS.length + " paradas · " + missed + " sem achar";
        }
        focusStage(index, mode);
        paintMap();
        paintHud();
      }

      function flashTodosPegos(done) {
        stamp.classList.add("is-on");
        qtyEl.classList.add("is-slam");
        window.setTimeout(function () {
          stamp.classList.remove("is-on");
          qtyEl.classList.remove("is-slam");
          done();
        }, reduce ? 0 : 920);
      }

      function goNext(kind) {
        if (busy || mode !== "run") return;
        busy = true;
        marks[here] = kind;
        const finish = function () {
          if (here >= UNITS.length - 1) {
            setMode("zen", here);
            busy = false;
            return;
          }
          here += 1;
          setMode("run", here);
          speakCurrent();
          busy = false;
        };
        if (kind === "feito") {
          flashTodosPegos(finish);
          return;
        }
        finish();
      }

      function startRun() {
        here = 0;
        marks = UNITS.map(function () { return "open"; });
        setMode("run", 0);
        speakCurrent();
      }

      function resetWave() {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        here = 0;
        marks = UNITS.map(function () { return "open"; });
        busy = false;
        setMode("claim", 0);
      }

      document.getElementById("iniciar").addEventListener("click", startRun);
      document.getElementById("feito").addEventListener("click", function () {
        goNext("feito");
      });
      document.getElementById("miss").addEventListener("click", function () {
        goNext("miss");
      });
      document.getElementById("again").addEventListener("click", resetWave);
      speekBtn.addEventListener("click", speakCurrent);
      document.getElementById("wave-link").addEventListener("click", function (event) {
        event.preventDefault();
        if (mode === "zen") return;
        if (mode === "run") return;
      });

      setMode("claim", 0);
    })();
  </script>
</body>
</html>
