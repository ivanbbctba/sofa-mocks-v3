<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#b7cfe0"/>
  <title>Onda 14 · Pisoly</title>
  <style>
    :root {
      --ink: #14202c;
      --ink-2: #334556;
      --mute: #5a6d7e;
      --paper: #8fb6ce;
      --road: #fff8ea;
      --rack: #d8c49a;
      --rack-edge: #b89a6a;
      --ok: #1f9d5c;
      --feito: #14171c;
      --white: #fffdf7;
      --run: #635bff;
      --shadow: 0 12px 32px rgba(12, 28, 40, 0.22);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #1c2a36;
      color: var(--ink);
      font: 16px/1.25 "Trebuchet MS", "Avenir Next", "Segoe UI", system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
    }

    .phone {
      position: relative;
      width: min(390px, 100vw);
      height: min(844px, 100dvh);
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 24px 60px rgba(16, 28, 40, 0.28);
    }

    .map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .map svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .floor-wash {
      fill: #7eafc8;
    }

    .yard {
      fill: #95c0d6;
    }

    .rack {
      fill: var(--rack);
      stroke: var(--rack-edge);
      stroke-width: 0.035;
    }

    .road {
      fill: none;
      stroke: var(--road);
      stroke-width: 0.78;
      stroke-linecap: round;
    }

    .road-cross {
      fill: none;
      stroke: var(--road);
      stroke-width: 0.7;
      stroke-linecap: round;
    }

    .aisle-tag {
      fill: #3d5566;
      font-size: 0.42px;
      font-family: "Trebuchet MS", system-ui, sans-serif;
      font-weight: 700;
    }

    .path-case {
      fill: none;
      stroke: #fff8ea;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 0.62;
      opacity: 0.95;
    }

    .path-ghost {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 0.34;
      opacity: 0.92;
      stroke-dasharray: 0.36 0.22;
      animation: march 1.05s linear infinite;
    }

    .path-claimed {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 0.3;
      opacity: 0.42;
    }

    .path-done {
      fill: none;
      stroke: var(--run);
      stroke-width: 0.42;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.78;
    }

    .path-play {
      fill: none;
      stroke: var(--run);
      stroke-width: 0.58;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .path-play.is-draw {
      stroke-dasharray: var(--len);
      stroke-dashoffset: var(--len);
      animation: draw-leg 0.95s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }

    .path-ahead {
      fill: none;
      stroke: var(--run);
      stroke-width: 0.32;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.55;
      stroke-dasharray: 0.34 0.26;
      animation: march 0.85s linear infinite;
    }

    .node-done { fill: #9aa6b4; }
    .node-future { fill: #d7dde4; }
    .node-next {
      fill: var(--white);
      stroke: var(--run);
      stroke-width: 0.09;
    }
    .node-here { fill: var(--ok); }
    .node-halo {
      fill: none;
      stroke: var(--ok);
      stroke-width: 0.07;
      opacity: 0.45;
    }
    .node-here.is-live {
      transform-box: fill-box;
      transform-origin: center;
      animation: here-pulse 2.2s ease-in-out infinite;
    }

    .chrome {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .chrome button,
    .chrome a {
      pointer-events: auto;
    }

    .top-chip {
      position: absolute;
      top: calc(10px + env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .share-pill,
    .count-pill {
      background: rgba(255, 253, 248, 0.88);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      box-shadow: var(--shadow);
      color: var(--ink-2);
      font-size: 12px;
      letter-spacing: -0.02em;
      padding: 7px 12px;
    }

    .count-pill {
      font-variant-numeric: tabular-nums;
    }

    .banner {
      position: absolute;
      top: calc(52px + env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 10px 16px 12px;
      border-radius: 26px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .qty {
      margin: 0;
      min-width: 1.1em;
      color: var(--run);
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -0.08em;
      line-height: 0.84;
      font-variant-numeric: tabular-nums;
    }

    .banner-copy { min-width: 0; }

    .slot {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .depois {
      margin: 4px 0 0;
      color: var(--mute);
      font-size: 15px;
    }

    .dock {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0 18px calc(18px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: linear-gradient(180deg, rgba(143, 182, 206, 0) 0%, rgba(143, 182, 206, 0.78) 46%, #8fb6ce 100%);
    }

    .speak {
      width: min(100%, 22rem);
      border: 0;
      border-radius: 18px;
      background: var(--white);
      box-shadow: var(--shadow);
      color: inherit;
      font: inherit;
      text-align: left;
      padding: 12px 14px;
      cursor: pointer;
    }

    .speak[hidden] { display: none; }

    .speak-kicker {
      margin: 0;
      color: var(--mute);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .speak-body {
      margin: 4px 0 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .feito,
    .go {
      width: 88px;
      height: 88px;
      border: 0;
      border-radius: 50%;
      background: var(--feito);
      color: #fff;
      font: 800 16px/1 "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
      letter-spacing: -0.03em;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(22, 24, 29, 0.28);
    }

    .go {
      background: var(--run);
      width: 104px;
      height: 104px;
      font-size: 17px;
    }

    .feito:active,
    .go:active {
      transform: scale(0.96);
    }

    .skip,
    .ghost {
      border: 0;
      background: transparent;
      color: var(--ink-2);
      font: 700 14px/1 "Trebuchet MS", system-ui, sans-serif;
      cursor: pointer;
      padding: 8px 10px;
    }

    .overview-copy,
    .taken-copy,
    .zen {
      position: absolute;
      left: 14px;
      right: 14px;
      border-radius: 24px;
      background: var(--white);
      box-shadow: var(--shadow);
      padding: 16px 16px 14px;
    }

    .overview-copy,
    .taken-copy {
      top: calc(52px + env(safe-area-inset-top));
    }

    .kicker {
      margin: 0;
      color: var(--mute);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .title {
      margin: 4px 0 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .lede {
      margin: 6px 0 0;
      color: var(--ink-2);
      font-size: 14px;
    }

    .swatches {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .swatches i {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: block;
      box-shadow: inset 0 0 0 2px rgba(255, 253, 248, 0.7);
    }

    .swatches i.is-taken {
      opacity: 0.28;
    }

    .zen {
      top: 18%;
      text-align: center;
    }

    .zen-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: var(--ok);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 800;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 16px 0 4px;
      text-align: left;
    }

    .stat {
      background: #f3efe6;
      border-radius: 14px;
      padding: 10px 12px;
    }

    .stat b {
      display: block;
      font-size: 20px;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .stat span {
      color: var(--mute);
      font-size: 12px;
    }

    .again {
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 999px;
      background: var(--feito);
      color: #fff;
      font: 800 16px/1 "Trebuchet MS", system-ui, sans-serif;
      padding: 16px;
      cursor: pointer;
    }

    .hidden { display: none !important; }

    @keyframes draw-leg {
      to { stroke-dashoffset: 0; }
    }

    @keyframes march {
      to { stroke-dashoffset: -0.5; }
    }

    @keyframes here-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @media (prefers-reduced-motion: reduce) {
      .path-play.is-draw,
      .path-ahead,
      .path-ghost,
      .node-here.is-live {
        animation: none !important;
      }
      .path-play.is-draw {
        stroke-dasharray: none !important;
        stroke-dashoffset: 0 !important;
      }
    }
  </style>
</head>
<body>
  <main class="phone" id="app">
    <div class="map" id="map" role="img" aria-label="Mapa do galpão"></div>
    <div class="chrome">
      <div class="top-chip">
        <p class="share-pill" id="share-pill">Onda 14 · 1 link</p>
        <p class="count-pill" id="count-pill">0 de 18</p>
      </div>

      <section class="overview-copy" id="overview-card">
        <p class="kicker">Onda compartilhada</p>
        <h1 class="title">Mapa do galpão</h1>
        <p class="lede" id="overview-lede">Seis corridas livres. Iniciar pega a próxima.</p>
        <div class="swatches" id="swatches" aria-hidden="true"></div>
      </section>

      <section class="taken-copy hidden" id="taken-card">
        <p class="kicker">Onda 14</p>
        <h1 class="title">Todos pegos</h1>
        <p class="lede">Nenhuma corrida livre neste link.</p>
      </section>

      <section class="banner hidden" id="pick-banner">
        <p class="qty" id="qty">10</p>
        <div class="banner-copy">
          <p class="slot" id="slot">A-01</p>
          <p class="depois" id="depois">depois C-02</p>
        </div>
      </section>

      <section class="zen hidden" id="zen">
        <div class="zen-mark" aria-hidden="true">✓</div>
        <p class="kicker">Chegou</p>
        <h1 class="title">Corrida feita</h1>
        <div class="stats">
          <p class="stat"><b id="zen-time">0:00</b><span>tempo</span></p>
          <p class="stat"><b id="zen-qty">0 un.</b><span>quantidade</span></p>
          <p class="stat"><b id="zen-kg">0 kg</b><span>peso</span></p>
          <p class="stat"><b id="zen-m3">0 m³</b><span>volume</span></p>
        </div>
        <p class="lede" id="zen-latency">aceite 0,0 s</p>
        <button type="button" class="again" id="again">Começar de novo</button>
      </section>

      <div class="dock" id="dock">
        <button type="button" class="speak hidden" id="speak" aria-expanded="false">
          <p class="speak-kicker">Falar</p>
          <p class="speak-body" id="speak-body">Dez toalhas 220 no A-01.</p>
        </button>
        <div class="actions">
          <button type="button" class="go" id="go">Iniciar</button>
          <button type="button" class="feito hidden" id="feito">Feito</button>
          <button type="button" class="skip hidden" id="skip">Não achei</button>
          <button type="button" class="ghost hidden" id="reset-wave">Nova onda</button>
        </div>
      </div>
    </div>
  </main>
  <script>
    (function () {
      const COLORS = ["#635bff", "#059669", "#ea580c", "#9333ea", "#e11d48", "#0284c8"];
      const AISLE_X = { A: 0.78, B: 1.92, C: 3.06, D: 4.2, E: 5.34, F: 6.48, G: 7.62, H: 8.76 };
      const Y0 = 1.55;
      const Y1 = 15.85;
      const TOP = 0.85;
      const BOT = 16.65;
      const NS = "http://www.w3.org/2000/svg";
      const FULL_VB = [0, -0.4, 9.55, 18.4];

      const RUNS = [
        {
          stops: [
            { code: "A-01", qty: 10, sku: "TOALHA-220", kg: 4.8, m3: 0.09, speak: "Dez toalhas 220 no A-01." },
            { code: "C-02", qty: 8, sku: "JOGO-LENCOL", kg: 6.1, m3: 0.12, speak: "Oito jogos de lençol no C-02." },
            { code: "E-01", qty: 10, sku: "FRONHA-PAR", kg: 2.4, m3: 0.05, speak: "Dez pares de fronha no E-01." },
            { code: "E-10", qty: 6, sku: "COBERTOR-CAS", kg: 7.2, m3: 0.16, speak: "Seis cobertores casal no E-10." }
          ]
        },
        {
          stops: [
            { code: "F-02", qty: 42, sku: "KIT-HIGIENE", kg: 9.4, m3: 0.11, speak: "Quarenta e dois kits higiene no F-02." },
            { code: "H-09", qty: 3, sku: "SABONETE", kg: 0.9, m3: 0.02, speak: "Três sabonetes no H-09." },
            { code: "H-03", qty: 12, sku: "SHAMPOO-400", kg: 5.1, m3: 0.07, speak: "Doze shampoos 400 no H-03." },
            { code: "G-01", qty: 7, sku: "CREME-HID", kg: 3.3, m3: 0.04, speak: "Sete cremes hidratantes no G-01." }
          ]
        },
        {
          stops: [
            { code: "B-09", qty: 5, sku: "ESC-DENTES", kg: 0.6, m3: 0.01, speak: "Cinco escovas de dente no B-09." },
            { code: "C-08", qty: 6, sku: "PILLOW-TOP", kg: 8.8, m3: 0.22, speak: "Seis pillow tops no C-08." },
            { code: "F-10", qty: 9, sku: "TAPETE-BAN", kg: 6.4, m3: 0.14, speak: "Nove tapetes de banho no F-10." },
            { code: "D-04", qty: 2, sku: "CORTINA-180", kg: 3.9, m3: 0.1, speak: "Duas cortinas 180 no D-04." }
          ]
        },
        {
          stops: [
            { code: "D-09", qty: 15, sku: "TOALHA-MAO", kg: 3.1, m3: 0.06, speak: "Quinze toalhas de mão no D-09." },
            { code: "A-08", qty: 1, sku: "ROUPAO-M", kg: 0.8, m3: 0.03, speak: "Um roupão M no A-08." },
            { code: "B-02", qty: 11, sku: "SACO-LIXO", kg: 2.2, m3: 0.05, speak: "Onze sacos de lixo no B-02." },
            { code: "H-01", qty: 8, sku: "PAPEL-HIG", kg: 4.0, m3: 0.08, speak: "Oito papéis higiênicos no H-01." }
          ]
        },
        {
          stops: [
            { code: "G-05", qty: 3, sku: "AMACIANTE", kg: 3.6, m3: 0.04, speak: "Três amaciantes no G-05." },
            { code: "G-08", qty: 4, sku: "ALGODAO", kg: 0.5, m3: 0.02, speak: "Quatro pacotes de algodão no G-08." },
            { code: "E-05", qty: 14, sku: "LENCOL-SOLT", kg: 5.7, m3: 0.13, speak: "Quatorze lençóis solteiro no E-05." },
            { code: "C-04", qty: 9, sku: "CAPA-TRV", kg: 2.8, m3: 0.07, speak: "Nove capas de travesseiro no C-04." }
          ]
        },
        {
          stops: [
            { code: "A-05", qty: 16, sku: "TOALHA-PISO", kg: 6.8, m3: 0.15, speak: "Dezesseis toalhas de piso no A-05." },
            { code: "B-06", qty: 4, sku: "KIT-BANHO", kg: 4.5, m3: 0.09, speak: "Quatro kits banho no B-06." },
            { code: "D-02", qty: 7, sku: "EDREDOM", kg: 8.1, m3: 0.19, speak: "Sete edredons no D-02." },
            { code: "F-06", qty: 5, sku: "PORTA-TRV", kg: 1.7, m3: 0.04, speak: "Cinco porta-travesseiros no F-06." }
          ]
        }
      ];

      function slotY(n) {
        return Y0 + ((n - 1) * (Y1 - Y0)) / 9;
      }

      function parseCode(code) {
        return { aisle: code[0], n: Number(code.slice(2)) };
      }

      function xy(code) {
        const parsed = parseCode(code);
        return { x: AISLE_X[parsed.aisle], y: slotY(parsed.n), aisle: parsed.aisle, n: parsed.n };
      }

      function hop(a, b) {
        if (a.aisle === b.aisle) return [a, { x: a.x, y: b.y }];
        const mid = (Y0 + Y1) / 2;
        const sameTop = a.y <= mid && b.y <= mid;
        const sameBot = a.y >= mid && b.y >= mid;
        let end;
        if (sameTop) {
          end = Math.min(a.y, b.y) - 0.7;
        } else if (sameBot) {
          end = Math.max(a.y, b.y) + 0.7;
        } else {
          const viaTop = Math.abs(a.y - TOP) + Math.abs(b.y - TOP);
          const viaBot = Math.abs(a.y - BOT) + Math.abs(b.y - BOT);
          end = viaTop <= viaBot ? TOP : BOT;
        }
        end = Math.max(TOP, Math.min(BOT, end));
        return [a, { x: a.x, y: end }, { x: b.x, y: end }, { x: b.x, y: b.y }];
      }

      function samePoint(p, q) {
        return Math.abs(p.x - q.x) < 0.001 && Math.abs(p.y - q.y) < 0.001;
      }

      function joinHops(hops) {
        const out = [];
        hops.forEach(function (seg) {
          seg.forEach(function (p, i) {
            if (i === 0 && out.length && samePoint(out[out.length - 1], p)) return;
            out.push(p);
          });
        });
        return out;
      }

      function geometryFor(stops) {
        const points = stops.map(function (stop) { return xy(stop.code); });
        const hops = points.slice(1).map(function (pt, i) { return hop(points[i], pt); });
        const fullPath = hops.length ? joinHops(hops) : points.slice();
        const hopSpans = [];
        let cursor = 0;
        hops.forEach(function (seg) {
          const extra = cursor === 0 ? seg.length : seg.length - 1;
          const start = cursor;
          cursor += extra;
          hopSpans.push({ from: start, to: cursor });
        });
        return { points: points, hops: hops, fullPath: fullPath, hopSpans: hopSpans };
      }

      const tours = RUNS.map(function (run, i) {
        return {
          color: COLORS[i],
          stops: run.stops,
          geo: geometryFor(run.stops)
        };
      });

      function slicePath(geo, fromIdx, toIdx) {
        if (!geo.hopSpans.length || toIdx <= 0) return geo.fullPath.slice(0, 1);
        const last = geo.hopSpans.length - 1;
        const startHop = Math.max(0, Math.min(fromIdx, last));
        const endHop = Math.max(0, Math.min(toIdx - 1, last));
        return geo.fullPath.slice(geo.hopSpans[startHop].from, geo.hopSpans[endHop].to + 1);
      }

      function pts(list) {
        return list.map(function (p) { return p.x + " " + p.y; }).join(" ");
      }

      function el(name, attrs) {
        const node = document.createElementNS(NS, name);
        Object.keys(attrs).forEach(function (key) {
          node.setAttribute(key, String(attrs[key]));
        });
        return node;
      }

      const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const map = document.getElementById("map");
      const sharePill = document.getElementById("share-pill");
      const countPill = document.getElementById("count-pill");
      const overviewCard = document.getElementById("overview-card");
      const overviewLede = document.getElementById("overview-lede");
      const takenCard = document.getElementById("taken-card");
      const pickBanner = document.getElementById("pick-banner");
      const qtyEl = document.getElementById("qty");
      const slotEl = document.getElementById("slot");
      const depoisEl = document.getElementById("depois");
      const zenEl = document.getElementById("zen");
      const speakEl = document.getElementById("speak");
      const speakBody = document.getElementById("speak-body");
      const goEl = document.getElementById("go");
      const feitoEl = document.getElementById("feito");
      const skipEl = document.getElementById("skip");
      const resetEl = document.getElementById("reset-wave");
      const swatches = document.getElementById("swatches");

      let mode = "overview";
      let claimed = [];
      let runIndex = -1;
      let here = 0;
      let missed = {};
      let openedAt = Date.now();
      let acceptMs = 0;
      let pickStartedAt = 0;
      let speakOpen = false;
      let viewBox = FULL_VB.slice();
      let vbTimer = 0;

      function freeIndexes() {
        return tours.map(function (_, i) { return i; }).filter(function (i) {
          return claimed.indexOf(i) === -1;
        });
      }

      function currentTour() {
        return runIndex >= 0 ? tours[runIndex] : null;
      }

      function setVar(color) {
        document.documentElement.style.setProperty("--run", color);
      }

      function fmtTime(ms) {
        const total = Math.max(0, Math.round(ms / 1000));
        const m = Math.floor(total / 60);
        const s = total % 60;
        return m + ":" + String(s).padStart(2, "0");
      }

      function fmtLat(ms) {
        const sec = Math.max(0, ms / 1000);
        return sec.toFixed(1).replace(".", ",") + " s";
      }

      function fmtNum(n, digits) {
        return n.toFixed(digits).replace(".", ",");
      }

      function hide(node, on) {
        node.classList.toggle("hidden", on);
      }

      function targetViewBox() {
        if (mode !== "pick") return FULL_VB.slice();
        const tour = currentTour();
        const geo = tour.geo;
        const a = geo.points[here];
        const b = geo.points[Math.min(here + 1, geo.points.length - 1)];
        const xs = [a.x, b.x];
        const ys = [a.y, b.y];
        const minX = Math.min.apply(null, xs) - 2.15;
        const maxX = Math.max.apply(null, xs) + 2.15;
        const minY = Math.min.apply(null, ys) - 2.4;
        const maxY = Math.max.apply(null, ys) + 2.7;
        return [minX, minY, Math.max(6.2, maxX - minX), Math.max(7.4, maxY - minY)];
      }

      function applyViewBox(svg, next, animate) {
        const dest = next.slice();
        if (!animate || reduce) {
          viewBox = dest;
          svg.setAttribute("viewBox", viewBox.join(" "));
          return;
        }
        const from = viewBox.slice();
        const t0 = performance.now();
        const dur = 720;
        if (vbTimer) cancelAnimationFrame(vbTimer);
        function frame(now) {
          const u = Math.min(1, (now - t0) / dur);
          const e = 1 - Math.pow(1 - u, 3);
          viewBox = from.map(function (v, i) { return v + (dest[i] - v) * e; });
          svg.setAttribute("viewBox", viewBox.join(" "));
          if (u < 1) vbTimer = requestAnimationFrame(frame);
        }
        vbTimer = requestAnimationFrame(frame);
      }

      function paintSwatches() {
        swatches.replaceChildren();
        COLORS.forEach(function (color, i) {
          const dot = document.createElement("i");
          dot.style.background = color;
          if (claimed.indexOf(i) !== -1) dot.className = "is-taken";
          swatches.appendChild(dot);
        });
      }

      function paintMap(fromIdx, toIdx, fly) {
        map.replaceChildren();
        const svg = el("svg", {
          viewBox: viewBox.join(" "),
          preserveAspectRatio: "xMidYMid meet",
          "aria-hidden": "true"
        });
        svg.appendChild(el("rect", { class: "floor-wash", x: -2, y: -2, width: 14, height: 22 }));
        svg.appendChild(el("rect", { class: "yard", x: 0.1, y: 0.08, width: 9.35, height: 17.35, rx: 0.28 }));
        svg.appendChild(el("line", { class: "road-cross", x1: 0.4, y1: TOP, x2: 9.15, y2: TOP }));
        svg.appendChild(el("line", { class: "road-cross", x1: 0.4, y1: BOT, x2: 9.15, y2: BOT }));

        Object.keys(AISLE_X).forEach(function (letter) {
          const x = AISLE_X[letter];
          svg.appendChild(el("line", { class: "road", x1: x, y1: 0.45, x2: x, y2: 16.9 }));
          svg.appendChild(el("rect", {
            class: "rack",
            x: x - 0.46,
            y: 1.2,
            width: 0.28,
            height: 15.05,
            rx: 0.07
          }));
          svg.appendChild(el("rect", {
            class: "rack",
            x: x + 0.18,
            y: 1.2,
            width: 0.28,
            height: 15.05,
            rx: 0.07
          }));
          const tag = el("text", { class: "aisle-tag", x: x, y: 0.52, "text-anchor": "middle" });
          tag.textContent = letter;
          svg.appendChild(tag);
        });

        if (mode === "overview" || mode === "taken") {
          tours.forEach(function (tour, i) {
            if (tour.geo.fullPath.length < 2) return;
            const taken = claimed.indexOf(i) !== -1;
            svg.appendChild(el("polyline", {
              class: "path-case",
              points: pts(tour.geo.fullPath)
            }));
            svg.appendChild(el("polyline", {
              class: taken ? "path-claimed" : "path-ghost",
              points: pts(tour.geo.fullPath),
              stroke: tour.color
            }));
            tour.geo.points.forEach(function (p) {
              svg.appendChild(el("circle", {
                cx: p.x,
                cy: p.y,
                r: taken ? 0.12 : 0.16,
                fill: tour.color,
                stroke: "#fff8ea",
                "stroke-width": 0.05,
                opacity: taken ? "0.5" : "1"
              }));
            });
          });
        }

        if (mode === "pick") {
          const tour = currentTour();
          const geo = tour.geo;
          if (geo.fullPath.length > 1) {
            svg.appendChild(el("polyline", {
              class: "path-claimed",
              points: pts(geo.fullPath),
              stroke: tour.color,
              opacity: "0.18"
            }));
          }
          const doneSeg = slicePath(geo, 0, toIdx);
          if (doneSeg.length > 1) {
            svg.appendChild(el("polyline", { class: "path-case", points: pts(doneSeg) }));
            svg.appendChild(el("polyline", { class: "path-done", points: pts(doneSeg) }));
          }
          const aheadSeg = slicePath(geo, toIdx, geo.points.length);
          if (aheadSeg.length > 1) {
            svg.appendChild(el("polyline", { class: "path-case", points: pts(aheadSeg), "stroke-width": 0.48 }));
            svg.appendChild(el("polyline", { class: "path-ahead", points: pts(aheadSeg) }));
          }
          let playNode = null;
          if (toIdx > 0) {
            const playSeg = slicePath(geo, fromIdx, toIdx);
            if (playSeg.length > 1) {
              svg.appendChild(el("polyline", { class: "path-case", points: pts(playSeg) }));
              playNode = el("polyline", { class: "path-play", points: pts(playSeg) });
              svg.appendChild(playNode);
            }
          }
          geo.points.forEach(function (p, i) {
            if (i === toIdx) {
              svg.appendChild(el("circle", { class: "node-halo", cx: p.x, cy: p.y, r: 0.5 }));
              const hereNode = el("circle", { class: "node-here", cx: p.x, cy: p.y, r: 0.26 });
              svg.appendChild(hereNode);
              if (!reduce) hereNode.classList.add("is-live");
              return;
            }
            if (i === toIdx + 1) {
              svg.appendChild(el("circle", { class: "node-next", cx: p.x, cy: p.y, r: 0.18 }));
              return;
            }
            svg.appendChild(el("circle", {
              class: i < toIdx ? "node-done" : "node-future",
              cx: p.x,
              cy: p.y,
              r: i < toIdx ? 0.1 : 0.08
            }));
          });
          map.appendChild(svg);
          applyViewBox(svg, targetViewBox(), fly);
          if (playNode && !reduce) {
            const len = playNode.getTotalLength();
            playNode.style.setProperty("--len", String(len));
            playNode.classList.add("is-draw");
          }
          return;
        }

        map.appendChild(svg);
        applyViewBox(svg, FULL_VB, fly);
      }

      function paintChrome() {
        const free = freeIndexes();
        paintSwatches();
        hide(overviewCard, mode !== "overview");
        hide(takenCard, mode !== "taken");
        hide(pickBanner, mode !== "pick");
        hide(zenEl, mode !== "zen");
        hide(goEl, mode !== "overview");
        hide(feitoEl, mode !== "pick");
        hide(skipEl, mode !== "pick");
        hide(resetEl, mode !== "taken");
        hide(speakEl, mode !== "pick");
        speakEl.setAttribute("aria-expanded", "true");

        if (mode === "overview") {
          setVar(COLORS[free[0]] || COLORS[0]);
          sharePill.textContent = "Onda 14 · 1 link";
          countPill.textContent = free.length + " livres";
          overviewLede.textContent = free.length === 1
            ? "Uma corrida livre. Iniciar pega ela."
            : free.length + " corridas livres. Iniciar pega a próxima.";
        }

        if (mode === "taken") {
          setVar("#16181d");
          sharePill.textContent = "Onda 14 · 1 link";
          countPill.textContent = "0 livres";
        }

        if (mode === "pick") {
          const tour = currentTour();
          const stop = tour.stops[here];
          const next = tour.stops[here + 1];
          setVar(tour.color);
          qtyEl.textContent = String(stop.qty);
          slotEl.textContent = stop.code;
          depoisEl.textContent = next ? "depois " + next.code : "última parada";
          countPill.textContent = here + " de " + tour.stops.length;
          sharePill.textContent = "Corrida " + (runIndex + 1);
          speakBody.textContent = stop.speak;
        }

        if (mode === "zen") {
          const tour = currentTour();
          sharePill.textContent = "Corrida " + (runIndex + 1);
          countPill.textContent = tour.stops.length + " de " + tour.stops.length;
        }
      }

      function showSpeak(open) {
        speakOpen = open;
        speakEl.setAttribute("aria-expanded", mode === "pick" ? "true" : "false");
        hide(speakEl, mode !== "pick");
      }

      function finishRun() {
        const tour = currentTour();
        let qty = 0;
        let kg = 0;
        let m3 = 0;
        tour.stops.forEach(function (stop, i) {
          if (missed[i]) return;
          qty += stop.qty;
          kg += stop.kg;
          m3 += stop.m3;
        });
        document.getElementById("zen-time").textContent = fmtTime(Date.now() - pickStartedAt);
        document.getElementById("zen-qty").textContent = qty + " un.";
        document.getElementById("zen-kg").textContent = fmtNum(kg, 1) + " kg";
        document.getElementById("zen-m3").textContent = fmtNum(m3, 2) + " m³";
        document.getElementById("zen-latency").textContent = "aceite " + fmtLat(acceptMs);
        mode = "zen";
        showSpeak(false);
        paintChrome();
        paintMap(0, 0, true);
      }

      function enterPick(index, fromOverview) {
        runIndex = index;
        here = 0;
        missed = {};
        speakOpen = false;
        mode = "pick";
        pickStartedAt = Date.now();
        paintChrome();
        paintMap(0, 0, fromOverview);
      }

      function advance() {
        const tour = currentTour();
        if (here + 1 >= tour.stops.length) {
          finishRun();
          return;
        }
        const from = here;
        here += 1;
        showSpeak(false);
        paintChrome();
        paintMap(from, here, true);
      }

      goEl.addEventListener("click", function () {
        const free = freeIndexes();
        if (!free.length) {
          mode = "taken";
          paintChrome();
          paintMap(0, 0, false);
          return;
        }
        acceptMs = Date.now() - openedAt;
        const next = free[0];
        claimed.push(next);
        enterPick(next, true);
      });

      feitoEl.addEventListener("click", function () {
        if (mode === "pick") advance();
      });

      skipEl.addEventListener("click", function () {
        if (mode !== "pick") return;
        missed[here] = true;
        advance();
      });

      document.getElementById("again").addEventListener("click", function () {
        openedAt = Date.now();
        runIndex = -1;
        here = 0;
        mode = freeIndexes().length ? "overview" : "taken";
        showSpeak(false);
        paintChrome();
        paintMap(0, 0, true);
      });

      resetEl.addEventListener("click", function () {
        claimed = [];
        runIndex = -1;
        here = 0;
        openedAt = Date.now();
        mode = "overview";
        showSpeak(false);
        paintChrome();
        paintMap(0, 0, true);
      });

      paintChrome();
      paintMap(0, 0, false);
    })();
  </script>
</body>
</html>
